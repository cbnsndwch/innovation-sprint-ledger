ck gives a common starting point. **It doesn't choose the problem, customer, solution, technology or business model.** The team does.\r\n\r\n## findings/F-ben-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"F-ben-01\",\r\n  \"sprint\": \"pestel\",            // pestel | sector\r\n  \"dimension\": \"economic\",       // pestel: political | economic | social | technological | environmental | legal\r\n                                 // sector: ecosystem | valuechain | frictions | competition | segments | models\r\n  \"author\": \"Ben\",               // the team member who owns it (who researched it, or who asked the AI)\r\n  \"title\": \"International arrivals fell in 2025 while domestic travel held\",   // one-line headline\r\n  \"detail\": \"68.3M international arrivals in 2025 vs 72.4M in 2024; NTTO projects ~70.5M in 2026.\",\r\n  \"whoAffected\": \"Operators that depend on overseas visitors\",\r\n  \"implication\": \"Revenue mix is shifting; operators look for ways to win domestic or Latin American demand.\",\r\n  \"sources\": [\r\n    { \"label\": \"NTTO, International Visitor Arrivals\", \"url\": \"https://…\", \"year\": \"2026\",\r\n      \"verified\": false, \"verifiedBy\": \"\", \"verifiedAt\": null,\r\n      \"pack\": false }            // true = cited from the Sector Exploration Pack's key figures (already checked by the organizers)\r\n  ],\r\n  \"origin\": \"team\",              // team | ai\r\n  \"key\": false,                  // Sprint 1 only: the team starred it as a key external factor\r\n  \"notes\": \"\",\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## opportunities/O-ana-01.json\r\n\r\nA specific friction for a clearly defined customer. Not a trend, and not yet a solution.\r\n\r\n```json\r\n{\r\n  \"id\": \"O-ana-01\",\r\n  \"title\": \"Cruise passengers' dead time on embarkation day\",\r\n  \"friction\": \"What goes wrong, or costs time, money or trust\",\r\n  \"who\": \"Who experiences it, as specifically as possible, and how many\",\r\n  \"howSolvedToday\": \"Workarounds and competitors, and what they fail to do\",\r\n  \"whyNow\": \"The external factor (Sprint 1) that makes it urgent\",\r\n  \"evidence\": \"Data, reviews, reports, in words\",\r\n  \"findingIds\": [\"F-ben-03\", \"F-carla-01\"],\r\n  \"sources\": [],\r\n  \"author\": \"Ana\", \"origin\": \"team\",\r\n  \"shortlisted\": false,          // the team shortlisted it for the hypotheses\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## hypotheses/H-ana-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"H-ana-01\", \"order\": 1,\r\n  \"title\": \"Working name\",\r\n  \"customer\": \"\", \"problem\": \"\", \"solution\": \"\", \"valueProp\": \"\", \"revenueModel\": \"\",\r\n  \"businessModel\": \"B2B\",        // B2C | B2B | B2B2C | Platform | Institutional | \"\"\r\n  \"whyNow\": \"\",\r\n  \"launchMarket\": \"Miami-Dade\",  // the Exploration Challenge asks for an initial launch market…\r\n  \"launchMarketWhy\": \"\",         // …justified with data: a figure and its source\r\n  \"openQuestions\": [\"assumptions that must be true and aren't proven yet\"],\r\n  \"opportunityIds\": [\"O-ana-01\"],\r\n  \"sources\": [],\r\n  \"scores\": { \"evidence\": 4, \"customer\": 3 },   // matrix scores by criterion id, set by the TEAM\r\n  \"author\": \"\", \"origin\": \"team\", \"archived\": false,\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## decisions/D-carla-01.json\r\n\r\nEvery sprint closes with a concrete decision.\r\n\r\n```json\r\n{ \"id\": \"D-carla-01\", \"workshop\": 1, \"step\": \"pestel\",   // pestel | sector | opportunities | hypothesis | team | other\r\n  \"decision\": \"Key external factors: …\", \"how\": \"consensus\", \"rationale\": \"\", \"votes\": { \"Ana\": \"H-carla-01\" },\r\n  \"date\": \"2026-10-20\", \"by\": \"Ana\", \"createdAt\": \"…\", \"updatedAt\": \"…\" }\r\n```\r\n\r\n## sessions/2026-10-20.json (end-of-session handoff)\r\n\r\n```json\r\n{\r\n  \"id\": \"2026-10-20\", \"date\": \"2026-10-20\", \"workshop\": 1, \"title\": \"Workshop 1 · Opportunity Discovery\",\r\n  \"decided\": \"What the team decided: the idea, the customer, the launch market\",\r\n  \"evidenceGaps\": \"One per line: what we assumed but haven't proven\",\r\n  \"questionsForNext\": \"One per line: what to ask in Workshop 2\",\r\n  \"nextTask\": \"Before the next workshop, who does what\",\r\n  \"notes\": \"\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## No file access? Hand back JSON\r\n\r\nIn a chat app you can't write files. Instead, finish your answer with one JSON block that the board's **Paste AI answer** buttons read: `{\"findings\":[…]}` on a research card, `{\"opportunities\":[…]}` or `{\"hypotheses\":[…]}` on those tabs (the skills show the exact shapes). The board assigns the ids.\r\n\r\nFor anything else (several kinds of files at once), give one block in the board's sharing format. The student pastes it into **⇄ Share → Add a teammate's work**:\r\n\r\n```json\r\n{ \"schema\": \"innovation-sprint-ledger/1\", \"from\": \"Claude\", \"files\": { \"findings/F-ana-07.json\": { … }, \"decisions/D-ana-02.json\": { … } } }\r\n```\r\n","workshop-handoff/SKILL.md":"---\r\nname: workshop-handoff\r\ndescription: Close an Innovation Sprint workshop session and prepare the next one. Log sprint decisions, write the end-of-session handoff (what we decided, evidence still missing, questions for the next workshop, who does what before then), produce the Workshop 1 summary that feeds Workshop 2 (Go to Market and Brand Sprint), outline the at most 4 Workshop 1 slides of the 12-slide pitch, and run a jury drill so every team member can explain the project. Use when a team says \"close the sprint\", \"log our decision\", \"wrap up the session\", \"what do we bring to Workshop 2\", \"outline our slides\", \"quiz me like the jury\", or \"where did we leave off?\" at the start of the next workshop.\r\n---\r\n\r\n# Close the session → hand off to the next workshop\r\n\r\nProgram rules that drive this skill:\r\n\r\n- **Every phase closes with concrete decisions.** No extending a block to perfect it.\r\n- **Every member must be able to explain** the problem, the value proposition, the business model, the commercial strategy and the main assumptions. The jury can question anyone.\r\n- The final deck is **max 12 slides** for an **8-minute** pitch (3 presenters) plus 5 minutes of jury questions. Each workshop contributes about 4 slides.\r\n\r\nRead `references/SCHEMA.md`, `ledger.json`, `decisions/`, the chosen hypothesis (`ledger.json → selection.hypothesisId`), and the newest file in `sessions/`.\r\n\r\n## Log a decision\r\n\r\nWhen the team tells you what it decided (closing Sprint 1, Sprint 2, or the hypothesis choice), write `decisions/D-<author>-<nn>.json` (the author's next free number, see SCHEMA.md): `workshop`, `step`, `decision` (in their words), `how` (consensus or vote), `rationale`, `date`, `by`. Don't log decisions they didn't make.\r\n\r\n## End-of-session handoff\r\n\r\nWrite `sessions/<YYYY-MM-DD>.json` (update it if it exists). Ask for anything you don't know, in **one** message:\r\n\r\n- `decided`: the idea, the customer, the launch market, in two or three lines\r\n- `evidenceGaps`: one per line. What they assumed but haven't proven. Include unchecked sources (`verified: false`) that the decision relies on.\r\n- `questionsForNext`: one per line. What to ask the next workshop's expert.\r\n- `nextTask`: who does what before the next workshop. Names, and one specific task each. \"Research more\" is too vague; \"Ana: confirm the GMCVB 2025 visitor-spending figure\" is right.\r\n\r\nEcho the four lines back so they can screenshot them.\r\n\r\n## Workshop 1 → Workshop 2 brief\r\n\r\nWorkshop 2 is the **Go to Market and Brand Sprint**: a marketing expert explains the essentials of a marketing plan, then the team runs the **AI Brand Studio** (name, tagline, logo) and the **Marketing and Acquisition Funnel**. Produce a one-page brief containing:\r\n\r\n1. The chosen idea: customer, problem, solution, value proposition, revenue model, business model, launch market and why\r\n2. Why this idea: the matrix scores of all three hypotheses and how the team decided\r\n3. The key external factors (starred PESTEL findings) and the evidence behind the problem, each marked checked or unchecked\r\n4. What Workshop 2 will need that's still missing: customer detail, channels, competitors' positioning\r\n5. Open questions and evidence gaps\r\n\r\nThe board's **Copy Workshop 2 brief** button produces the same thing. If the board is open, point them to it instead of retyping.\r\n\r\n## Slide outline (at most 4 Workshop 1 slides)\r\n\r\nPropose at most 4 slides. For each: a **headline that states a conclusion** (not a topic: \"Cruise passengers lose 4 hours on embarkation day\" rather than \"The problem\"), the **one** number or piece of evidence that proves it (only from their material), and what to leave out. A typical set: the problem and its evidence · the customer and the launch market · why this opportunity (vs. the other two) · the solution and value proposition.\r\n\r\n## Jury drill\r\n\r\nQuiz **one** team member at a time: 5 questions, one per message, about the problem, the customer, the evidence, why this idea over the other two, and the launch market. After each answer, give one line on clarity and brevity. If they don't know, coach them to say so honestly and to explain how they'd find out (the program asks for exactly that).\r\n\r\n## \"Where did we leave off?\" (start of the next workshop)\r\n\r\nRead the newest session file. Lead with the `decided` line, then `nextTask` (and ask whether it got done), then `evidenceGaps`. Recommend one thing to do first.\r\n"}; // { 'sector-research/SKILL.md': '…', … } bundled at build time

  // Sprint 1: one PESTEL dimension per person. Hints stay sector-neutral: the same board serves all eight packs.
  const PESTEL = [
    ['political', 'Political', 'Government policy, public funding and promotion, trade, international relations, local politics'],
    ['economic', 'Economic', 'Demand, prices, exchange rates, interest rates, labor costs, investment'],
    ['social', 'Social', 'Demographics, habits, values, how people buy, trust and expectations'],
    ['technological', 'Technological', 'AI, platforms, payments, automation, data, infrastructure'],
    ['environmental', 'Environmental', 'Climate and weather risk, sustainability pressure, resources, waste'],
    ['legal', 'Legal', 'Regulation, licensing, consumer protection, labor law, data privacy']
  ];
  // Sprint 2: how the sector works. Starter questions come from the team's Sector Exploration Pack when it has them.
  const SECTOR_DIMS = [
    ['ecosystem', 'Ecosystem and actors', /ecosystem|actor/i, 'Which types of companies capture most of the value, and who is entering or leaving?'],
    ['valuechain', 'Value chain', /value chain/i, 'At which step of the chain do customers or operators lose time, money or trust? Who captures the margin?'],
    ['frictions', 'Processes and frictions', /process|friction/i, 'What do people still do manually, or work around, today? What evidence shows it matters?'],
    ['competition', 'Existing solutions and competition', /solution|competi/i, 'How is the problem solved today, and by whom? What do those solutions fail to do?'],
    ['segments', 'Segments and needs', /segment|need/i, 'Which customer is most affected? How big is that group?'],
    ['models', 'Business models and monetization', /business model|moneti|revenue/i, 'Which revenue model fits? Who pays, and why?']
  ];
  const BIZ_MODELS = ['B2C', 'B2B', 'B2B2C', 'Platform', 'Institutional'];
  const TABS = [['brief', 'Brief'], ['team', 'Team'], ['pestel', '1 · PESTEL'], ['sector', '2 · Sector'], ['opportunities', 'Opportunities'], ['hypotheses', 'Hypotheses'], ['evidence', 'Evidence'], ['handoff', 'Handoff']];

  let tab = LL.lsGet('isl:tab', 'brief');
  let evFilter = LL.lsGet('isl:evFilter', 'all');
  let openRef = null; // { slot, id }
  const L = () => Ledger.state.ledger;
  const S = () => Ledger.state.sector;
  const members = () => L().team.members.map(m => m.name);
  const saveL = LL.debounce(() => Ledger.saveLedger(), 300);
  const byCreated = (a, b) => String(a.createdAt || a.id).localeCompare(String(b.createdAt || b.id));
  const all = (slot) => Object.values(Ledger.state[slot]);
  const findings = (sprint, dim) => all('findings').filter(f => f.sprint === sprint && (!dim || f.dimension === dim)).sort((a, b) => (b.key ? 1 : 0) - (a.key ? 1 : 0) || byCreated(a, b));
  const opportunities = () => all('opportunities').sort((a, b) => (b.shortlisted ? 1 : 0) - (a.shortlisted ? 1 : 0) || byCreated(a, b));
  const hypotheses = () => all('hypotheses').filter(x => !x.archived).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.id).localeCompare(b.id));
  const decisions = () => all('decisions').sort((a, b) => String(b.date || '').localeCompare(a.date || '') || String(b.id).localeCompare(a.id));
  const sessions = () => all('sessions').sort((a, b) => String(b.date || b.id).localeCompare(a.date || a.id));
  const dimLabel = (sprint, d) => ((sprint === 'pestel' ? PESTEL : SECTOR_DIMS).find(x => x[0] === d) || [d, d])[1];

      h('button', { id: 'share-btn', class: 'btn sm', onclick: () => teamShare(), title: 'Send your work to your team, or add theirs' }, '⇄ Share'),

  // ---------------- progress strip: gates + timer ----------------
  function gates() {
    const l = L(), hs = hypotheses(), sel = selected();
    const covered = (sprint, dims) => dims.filter(([d]) => findings(sprint, d).length).length;
    const core = ['customer', 'problem', 'solution', 'valueProp', 'revenueModel'];
    const scored = hs.length >= 3 && hs.every(x => l.matrix.criteria.every(c => (x.scores || {})[c.id]));
    return [
      ['Team Leader chosen', !!l.team.leader, 'team'],
      ['PESTEL: all 6 dimensions', covered('pestel', PESTEL) === 6, 'pestel', covered('pestel', PESTEL) + '/6'],
      ['Key external factors picked', findings('pestel').filter(f => f.key).length >= 3, 'pestel', findings('pestel').filter(f => f.key).length + ' ★'],
      ['Sector: all 6 dimensions', covered('sector', SECTOR_DIMS) === 6, 'sector', covered('sector', SECTOR_DIMS) + '/6'],
      ['Opportunity list', opportunities().length >= 3, 'opportunities', String(opportunities().length)],
      ['Three hypotheses', hs.filter(x => core.every(k => (x[k] || '').trim())).length >= 3, 'hypotheses', hs.filter(x => core.every(k => (x[k] || '').trim())).length + '/3'],
      ['Matrix scored', scored, 'hypotheses'],
      ['Idea chosen + decision logged', !!(sel && l.selection.decidedAt), 'hypotheses'],

    ];
  }
  function strip() {
    const g = gates(), done = g.filter(x => x[1]).length;
    const srcs = allSources(), checked = srcs.filter(x => x.src.verified).length;
    return h('div', { class: 'strip' },

        figs.length ? h('select', { style: { width: 'auto', maxWidth: '100%' }, onchange: e => { const f = figs[+e.target.value]; if (!f) return; const yr = (/(20\d\d)/.exec(f.source) || [])[1] || ''; o.sources.push({ label: f.source + ': ' + f.figure, url: '', year: yr, pack: true, verified: true, verifiedBy: 'Sector Exploration Pack', verifiedAt: LL.nowIso() }); Ledger.save(path, o); redraw(); } },
          h('option', { value: '' }, '+ Cite a figure from the pack…'), figs.map((f, i) => h('option', { value: i }, '[' + f.level + '] ' + f.figure.slice(0, 80)))) : null),
      h('small', { class: 'muted', style: { display: 'block', marginTop: '6px' } }, 'Only click “I checked it” after you opened the source and saw it says this. Editing the source clears the check.'));
  }

  // ---------------- sharing (no server: a shared folder, or files / pasted text) ----------------
  function shareCard() {
    const folder = Ledger.store && Ledger.store.kind === 'folder';
    return card('c12 share-card', 'How the team shares one board', h('div', { class: 'share-grid' },
      h('div', null, h('h4', null, '1 · Team Leader collects'), h('p', { class: 'small' }, 'Everyone works on their own laptop. Every so often each person clicks ', h('b', null, '⇄ Share → Share my work'), ' and sends it to the Team Leader (WhatsApp, Teams, email). The Team Leader clicks ', h('b', null, 'Add a teammate’s work'), ' for each one, then shares the merged board back.')),
      h('div', null, h('h4', null, '2 · One shared folder'), h('p', { class: 'small' }, 'If everyone has OneDrive, Google Drive or Dropbox on their laptop, make one shared folder and have everyone ', h('b', null, 'Connect a folder'), ' to it (Chrome or Edge). Work then shows up on everyone’s board by itself, within the time the sync takes.'),
        folder ? h('p', { class: 'small muted' }, 'You’re connected to “' + Ledger.store.label + '”.') : null),
      h('div', null, h('h4', null, '3 · One person drives'), h('p', { class: 'small' }, 'One laptop on the big screen holds the board. The others research with the copy-ready prompts and dictate their findings, or send them as text.'))),
      null, h('button', { class: 'btn sm', onclick: () => teamShare() }, '⇄ Share'));
  }
  async function teamShare() {
    const v = await modal({ title: 'Share', body: h('div', null,
      h('p', null, h('b', null, 'Share my work: '), 'pack up everything on your board and send it to your Team Leader.'),
      h('p', null, h('b', null, 'Add a teammate’s work: '), 'merge what a teammate sent you into your board. Adding the same work twice is harmless.')),
      actions: [{ label: 'Close', value: null }, { label: 'Add a teammate’s work', value: 'add' }, { label: 'Share my work', value: 'share', cls: 'primary' }] });
    if (v === 'share') LL.shareWork();
    if (v === 'add') LL.addWork();
  }

  // ---------------- guided tour (driver.js, loaded from the CDN only when someone starts it) ----------------
  const DRIVER = { v: '1.3.1',
    js: ['https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js', 'sha384-BhR06AMz62Xn0o53z8itVS1vw4JslNckRFgOTa6/Dob0Agdmbbh8Dr9sDO2h18TO'],
    css: ['https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css', 'sha384-eyrYgcjChmzD338JTHFZssgJHOqqOZbajet8yZpCw8ESroLDi28BarMEKCImNGHC'] };
  let driverLoad = null;
  function loadDriver() {
    if (window.driver && window.driver.js) return Promise.resolve(window.driver.js.driver);
    return driverLoad = driverLoad || new Promise((res, rej) => {
      document.head.append(h('link', { rel: 'stylesheet', href: DRIVER.css[0], integrity: DRIVER.css[1], crossorigin: 'anonymous' }));
      const sc = h('script', { src: DRIVER.js[0], integrity: DRIVER.js[1], crossorigin: 'anonymous' });
      sc.onload = () => res(window.driver.js.driver);
      sc.onerror = () => { driverLoad = null; sc.remove(); rej(new Error('offline')); };
      document.head.append(sc);
    });
  }
  function tourSteps() {
    const S0 = (el, title, description, t, side) => ({ element: el, tab: t, popover: { title, description, side, align: 'start' } });
    const steps = [
      S0(null, 'Welcome to your sprint board', 'This is where your team does Workshop 1: from your sector to one business idea backed by evidence, in 2 hours. This tour takes 2 minutes.', null),
      S0('.tabs', 'One tab per step', 'Work left to right: read the <b>Brief</b>, set up the <b>Team</b>, research in <b>1 · PESTEL</b> and <b>2 · Sector</b>, then <b>Opportunities</b> and <b>Hypotheses</b>. <b>Evidence</b> and <b>Handoff</b> close the session.', null, 'bottom'),
      document.querySelector('.me-sel') ? S0('.me-sel', 'Who are you?', 'Pick your name. Everything you add gets it, and the AI setup prompt knows which dimension is yours.', null, 'bottom') : null,
      S0('#ai-btn', 'Set up your AI', 'Copy one prompt and paste it into Claude, ChatGPT or Grok. It already knows your team, your sector and today’s plan, and it guides you step by step.', null, 'bottom'),
      S0('#share-btn', 'Share with your team', 'Each person sends their work to the Team Leader (as a file, or as text in WhatsApp or Teams). The Team Leader adds everyone’s work and shares the full board back.', null, 'bottom'),
      S0('.pill', 'Where your work is saved', LL.fsSupported() ? 'Click here, then <b>Connect a folder</b> to save your work as files on your laptop. Agents like Claude Code, Codex or Cursor can work in that folder too.' : 'In this browser, your work is saved inside the browser only. To save to a folder, open the board in <b>Chrome or Edge</b> on a laptop.', null, 'bottom'),
      S0('.strip > .card:first-child', 'Workshop 1, step by step', 'Nine steps. Each one turns green when it’s done. Click any of them to jump there.', null, 'bottom'),
      S0('.timer', 'The sprint clock', 'The Team Leader starts the agenda, and the clock counts down each block. When time’s up, close the block with a decision.', null, 'bottom'),
      S0('.ev-mini', 'Sources checked by a person', 'What the AI finds arrives <b>unchecked</b>. Open each source yourself. If it says what the finding claims, click <b>I checked it</b>. The jury will ask.', null, 'left'),
      S0('#tab-team-members', 'Your team', 'Add everyone and click a name to make them Team Leader. Then use <b>Share out</b> to give each person a PESTEL dimension and a sector dimension.', 'team'),
      S0('.dims > .dim:first-child', 'Research one dimension', '<b>1 · Copy research prompt</b> → paste it into your AI → <b>2 · Paste AI answer</b>. The findings appear here. Then the team stars ★ the key factors.', 'pestel', 'right'),
      S0('.board-bar', 'From findings to opportunities', 'Each card is one specific problem: who has it, how it’s solved today, and the evidence. The team shortlists the best 2–4.', 'opportunities', 'bottom'),
      S0('.board-bar', 'Three hypotheses and the matrix', 'Write three ideas, score them on the weighted matrix, ask the AI to <b>challenge</b> them like an investor, then <b>Decide</b> together. Then add the launch market, with data.', 'hypotheses', 'bottom'),
      S0('.board-bar', 'Every source in one place', 'See what’s still unchecked, what came from the AI, and which findings have no source at all.', 'evidence', 'bottom'),
      S0('.callout', 'Close the session', 'Log your decisions and the handoff. <b>Copy Workshop 2 brief</b> takes everything into the Go-to-Market session. <b>Copy jury drill prompt</b> lets you practise answering the jury.', 'handoff', 'bottom'),
      S0(null, 'You’re ready', S() ? 'Start on the <b>Team</b> tab, or click <b>✦ Set up your AI</b>. You can replay this tour any time with <b>? Tour</b>.' : 'First, pick your sector on the <b>Brief</b> tab. Then click <b>✦ Set up your AI</b>. You can replay this tour any time with <b>? Tour</b>.', 'brief')
    ].filter(Boolean);
    return steps;
  }
  async function startTour() {
    let drv;
    try { drv = await loadDriver(); } catch { toast('The tour needs an internet connection. Everything else works offline.', 4500); return; }
    if (drawer.classList.contains('open')) closeDrawer();
    const steps = tourSteps(), start = tab;
    const hop = (i, dir) => () => {
      const next = steps[i + dir]; const want = next && next.tab;
      if (want && want !== tab) go(want);
      setTimeout(() => dir > 0 ? d.moveNext() : d.movePrevious(), 60);
    };
    const d = drv({
      showProgress: true, allowClose: true, overlayOpacity: 0.55, smoothScroll: true, popoverClass: 'isl-tour', stagePadding: 6,
      nextBtnText: 'Next →', prevBtnText: '← Back', doneBtnText: 'Done', progressText: '{{current}} of {{total}}',
      steps: steps.map((st, i) => ({ element: st.element || undefined, popover: Object.assign({}, st.popover, { onNextClick: i < steps.length - 1 ? hop(i, 1) : () => d.destroy(), onPrevClick: i > 0 ? hop(i, -1) : undefined }) })),
      onDestroyed: () => { LL.lsSet('isl:toured', true); if (tab !== start && start === 'brief') go('brief'); }
    });
    d.drive();
    window.__tour = d;
  }

  // ---------------- set up your AI ----------------
  const skillNames = () => [...new Set(Object.keys(SKILL_FILES).map(k => k.split('/')[0]))];
  const skillBody = (name) => String(SKILL_FILES[name + '/SKILL.md'] || '').replace(/^---[\s\S]*?---\s*/, '');
  function setupPrompt() {
    const l = L(), you = LL.me(), a = l.assignments;
    const mine = (sprint, dims) => dims.filter(([d]) => a[sprint][d] && a[sprint][d] === you).map(([, label]) => label);
    const st = timerState();
    return `You're my team's AI partner for the Innovation Sprint Challenge (Spain-US Chamber of Commerce, Miami International Week), Workshop 1: AI Opportunity Discovery Sprint. Read everything below, then start.

ABOUT ME AND MY TEAM
- Me: ${you || '(ask my name)'}${you && you === l.team.leader ? ' (Team Leader)' : ''}
- Team: ${l.team.name || '(no name yet)'} · ${members().join(', ') || '(members not listed yet)'}${l.team.leader ? ' · Team Leader: ' + l.team.leader : ''}
- My Sprint 1 (PESTEL) dimension: ${mine('pestel', PESTEL).join(', ') || 'not assigned yet'}
- My Sprint 2 (sector) dimension: ${mine('sector', SECTOR_DIMS).join(', ') || 'not assigned yet'}
- Right now: ${st.i >= 0 ? 'agenda block ' + (st.i + 1) + ' of ' + st.ag.length + ', "' + st.block.label + '", ' + Math.max(0, Math.round(st.left / 60)) + ' minutes left' : 'the agenda has not started'}

HOW WE WORK TOGETHER
- Our team keeps its work on a board (a page called sprint.html). You can't see it. When I ask you for findings, opportunities or hypotheses, finish your answer with ONE JSON block in the exact shape the playbooks below show. I paste it into the board with "Paste AI answer".
- The playbooks mention files (findings/F###.json and so on). If you can't write files, ignore that part and give me the JSON block instead. If you CAN read and write files in a folder I gave you, follow AGENTS.md in that folder.
- I'm an MBA student under time pressure, maybe working in my second language. Be brief and concrete. One step at a time.
- The rules that matter most: AI proposes, the TEAM decides. Use real, checkable sources only (publisher, title, year, URL), and write "source to find" rather than guess. Never claim a source is verified: only a person who opened it can. Every sprint ends with a decision. Every member must be able to explain our choices to the jury.

THE WORKSHOP 1 AGENDA (120 minutes)
${l.workshop.agenda.map((b, i) => `${i + 1}. ${b.label} (${b.minutes} min)`).join('\n')}

OUR SECTOR
${ctx()}
${S() && (S().sprint2Questions || []).length ? '\nSprint 2 starter questions from our pack:\n' + S().sprint2Questions.map(q => `- ${q.dimension}: ${q.question}`).join('\n') : ''}

PLAYBOOK 1 · RESEARCH ONE DIMENSION (Sprints 1 and 2)
${skillBody('sector-research')}

PLAYBOOK 2 · OPPORTUNITIES → THREE HYPOTHESES → MATRIX → DECISION
${skillBody('opportunity-matrix')}

PLAYBOOK 3 · CLOSE THE SESSION, AND PREPARE WORKSHOP 2
${skillBody('workshop-handoff')}

START NOW: greet me in one line. Say where we are in the agenda and what my next step is. Offer to start on my dimension.`;
  }
  async function writeAgentFolder() {
    const st = Ledger.store;
    const schema = SKILL_FILES['sprint-ledger/references/SCHEMA.md'] || '';
    await Ledger.putBlob('AGENTS.md', schema);
    await Ledger.putBlob('CLAUDE.md', '@AGENTS.md\n');
    for (const [rel, text] of Object.entries(SKILL_FILES)) for (const root of ['.claude/skills', '.agents/skills']) await Ledger.putBlob(root + '/' + rel, text);
    await Ledger.writeChain;
    toast('Set up “' + st.label + '” for your agent');
  }
  async function aiSetup() {
    const folder = Ledger.store && Ledger.store.kind === 'folder';
    const names = skillNames();
    const body = h('div', { class: 'ai-setup' },
      h('section', null, h('h4', null, '1 · Chat with Claude, ChatGPT or Grok', h('span', { class: 'chip primary', style: { marginLeft: '8px' } }, 'easiest')),
        h('p', { class: 'small' }, 'Works on the web, the desktop apps and phones. Copy the prompt and paste it as the first message of a new chat. It already knows your team, your sector and today’s plan, and it guides you step by step.'),
        h('p', { class: 'small muted' }, 'Using Claude? Put it in a Project’s instructions instead, so every chat in that project starts set up.'),
        !LL.me() ? h('p', { class: 'small', style: { color: 'var(--warn)' } }, 'Pick your name at the top first, so the prompt knows who you are and which dimension is yours.') : null,
        h('button', { class: 'btn accent', onclick: () => copyText(setupPrompt(), 'Setup prompt copied. Paste it into your AI') }, 'Copy setup prompt')),
      h('section', null, h('h4', null, '2 · An agent that works in a folder'),
        h('p', { class: 'small' }, 'Claude Code, Claude desktop with a folder, Codex, Cursor or Grok. The board writes the instructions and skills into your folder. Then open that folder in your agent and say ', h('b', null, '“Read AGENTS.md and get me started.”')),
        folder ? h('button', { class: 'btn', onclick: async () => { await writeAgentFolder(); } }, 'Set up “' + Ledger.store.label + '” for my agent')
          : h('button', { class: 'btn', onclick: async () => { const s2 = await LL.pickFolder(); if (s2) { await Ledger.open(s2); await writeAgentFolder(); } } }, LL.fsSupported() ? 'Connect a folder and set it up' : 'Needs Chrome or Edge')),
      names.length ? h('section', null, h('h4', null, '3 · Skills for the Claude app (optional)'),
        h('p', { class: 'small' }, 'In Claude (web or desktop): Settings → Capabilities → Skills → upload each .zip. Claude then uses them on its own in every chat.'),
        h('div', { class: 'chips' }, names.map(n => h('button', { class: 'btn sm', onclick: () => {
          const files = Object.fromEntries(Object.entries(SKILL_FILES).filter(([k]) => k.startsWith(n + '/')));
          const a = h('a', { href: URL.createObjectURL(LL.makeZip(files)), download: n + '.zip' }); document.body.append(a); a.click(); a.remove();
        } }, '⬇ ' + n)))) : null);
    await modal({ title: 'Set up your AI', body, wide: true, actions: [{ label: 'Close', value: null }] });
  }

  // ---------------- wire up ----------------
  Ledger.on((type, detail) => {
    if (type === 'load') { bannerHost.innerHTML = ''; render(); }
    if (type === 'imported' && !S() && detail && detail.sector) { const sec = BUILTIN_SECTORS.find(x => x.id === detail.sector); if (sec) Ledger.save('sector.json', LL.clone(sec)); }
    if (type === 'external') {
      const editing = openRef && detail.includes(`${openRef.slot}/${openRef.id}.json`);
      const active = document.activeElement;
      const typing = active && /TEXTAREA|INPUT|SELECT/.test(active.tagName) || (active && active.isContentEditable);
      if (detail.length <= 3) toast(detail.length === 1 ? 'Teammate update: ' + detail[0] : detail.length + ' files updated');
      if (editing && typing) return; // don't yank the field out from under the user
      if (editing) openItem(openRef.slot, openRef.id);
      if (!typing) render();
    }
    if (type === 'merged') {
      toast('Merged with a teammate’s change to ' + detail);
      const active = document.activeElement;
      if (!(active && (/TEXTAREA|INPUT|SELECT/.test(active.tagName) || active.isContentEditable))) render();
    }
    if (type === 'badjson') toast('Couldn’t read ' + detail + '. It isn’t valid JSON. Ask your agent to fix it.', 5000);
  });

  LL.boot({
    needReconnect: (name, reconnect, cache) => { LL.reconnectBanner(bannerHost, name, reconnect, cache); render(); }
  }).catch(e => { console.error(e); toast('Startup problem: ' + e.message); });
  render();
  window.SprintApp = { startTour, tourSteps, render, researchPrompt, oppPrompt, hypPrompt, challengePrompt, summaryMd, w2Prompt, matrixScore, parseAiJson, setupPrompt, writeAgentFolder, SKILL_FILES };
})();

</script>
