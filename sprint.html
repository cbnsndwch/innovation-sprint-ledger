vidence come from the findings, or does it rest on unchecked sources only?\r\n4. The team shortlists (`shortlisted: true`). Usually 2–4.\r\n\r\n## 2 · Three business hypotheses\r\n\r\n1. Draft three to `hypotheses/H-<author>-<nn>.json` from the shortlist: `customer`, `problem`, `solution`, `valueProp`, `revenueModel`, `businessModel` (B2C, B2B, B2B2C, Platform or Institutional), `whyNow`, `launchMarket`, `opportunityIds`, and `openQuestions` (start with the assumption that kills it if it's wrong). `origin: \"ai\"`, `scores: {}`.\r\n2. Make them **genuinely different**: a different customer, or a different business model. Not three versions of one app. The solution can be digital, physical, in-person, financial, technological, operational or hybrid.\r\n3. Ask the team to rewrite them in their own words. They'll have to defend every line to the jury.\r\n\r\n## 3 · The weighted decision matrix\r\n\r\n- Criteria and weights live in `ledger.json → matrix.criteria` (the defaults come from what the jury evaluates). If the team changes them, check that the weights add up to 100.\r\n- Scores live on each hypothesis: `scores: { \"<criterion id>\": 1–5 }`. **The team scores.** If they ask, suggest a score per cell with one line of reasoning tied to their findings, and let them change it.\r\n- Matrix score = Σ(weight × score) / (Σweight × 5) × 100.\r\n- If the top two are within ~5 points, say so: the matrix doesn't decide, it structures the discussion.\r\n\r\n## 4 · Stress test (before they decide)\r\n\r\nAct as a **skeptical seed investor on the jury**. For each hypothesis: the three hardest questions, the weakest assumption and the evidence that would change your mind, who already solves this and why they haven't won. Finish with which hypothesis has the least evidence behind it. Be direct and brief. Don't pick a winner.\r\n\r\n## 5 · The decision\r\n\r\nThe team tries for consensus. If there's none within the time available, they **vote on the matrix criteria** (program rule). Once they tell you:\r\n\r\n1. `ledger.json → selection`: `hypothesisId`, `method` (consensus or vote), `votes` (if they voted), `rationale` (their words), `decidedAt`.\r\n2. `decisions/D-<author>-<nn>.json`: `workshop: 1`, `step: \"hypothesis\"`, `decision` (\"Chose H-ana-02 · … (matrix 78/100)\"), `how`, `rationale`, `date`.\r\n3. Then define the chosen idea fully: customer, problem, solution, value proposition, revenue model.\r\n\r\n## 6 · Launch market, justified with data\r\n\r\nThe Exploration Challenge asks for an initial launch market (for example Miami/Florida or another U.S. region), **justified with data**. Compare 2–3 candidates on the size of the customer group (with a number and source), reachability, competition and risk. Write the team's choice to `launchMarket` and its justification (a figure plus its source) to `launchMarketWhy`. Add the sources to the hypothesis's `sources` with `verified: false`.\r\n\r\n## No file access?\r\n\r\nGive them text, then one JSON block that the board can import with **Paste AI answer** on the Opportunities or Hypotheses tab:\r\n\r\n```json\r\n{\"opportunities\":[{\"title\":\"\",\"friction\":\"\",\"who\":\"\",\"howSolvedToday\":\"\",\"whyNow\":\"\",\"evidence\":\"\",\"findingIds\":[\"F-ana-01\"]}]}\r\n```\r\n```json\r\n{\"hypotheses\":[{\"title\":\"\",\"customer\":\"\",\"problem\":\"\",\"solution\":\"\",\"valueProp\":\"\",\"revenueModel\":\"\",\"businessModel\":\"B2B\",\"launchMarket\":\"\",\"whyNow\":\"\",\"killerAssumption\":\"\"}]}\r\n```\r\n","pack-to-sector/references/SCHEMA.md":"# Innovation Sprint Ledger: folder format (schema `innovation-sprint-ledger/1`)\r\n\r\nOne team = one folder of plain JSON files. `sprint.html` (one self-contained page, no server) reads and writes it, and so can you. The page checks the folder every few seconds, so whatever you change shows up on the student's screen on its own.\r\n\r\n## Getting started (agents: read this first)\r\n\r\nWhen a student opens this folder and says something like \"get me started\":\r\n\r\n1. Read `ledger.json` (team, members, assignments, agenda) and `sector.json` (their Sector Exploration Pack). Ask their name if you don't know it. It goes in `author` and in the ids you create.\r\n2. Use the skills in `.claude/skills/` or `.agents/skills/` if your app hasn't loaded them already: `sprint-ledger` (\"where are we?\"), `sector-research` (Sprints 1 and 2), `opportunity-matrix` (opportunities → hypotheses → matrix → decision), `workshop-handoff` (closing the session, Workshop 2 brief).\r\n3. Say in one line where the team is (the first Workshop 1 step that isn't done, see the table below) and offer the next step. Keep it short: they're in a timed workshop.\r\n4. They see your changes on their board (`sprint.html`, opened in Chrome or Edge and connected to this folder) within a few seconds.\r\n\r\nThis is the team's working record for the **Innovation Sprint Challenge** (Spain-US Chamber of Commerce, Miami International Week). Workshop 1, *AI Opportunity Discovery Sprint*, takes the team from a sector to one chosen business hypothesis:\r\n\r\n| Step | Program | Files |\r\n|---|---|---|\r\n| Kick-off | Team Leader, how we'll work, who takes which dimension | `ledger.json → team, assignments` |\r\n| Sprint 1 · PESTEL | Each person takes one dimension. The team stars the key external factors | `findings/` with `\"sprint\": \"pestel\"`, `\"key\": true` |\r\n| Sprint 2 · How the sector works | Each person takes one dimension. The team lists possible opportunities | `findings/` with `\"sprint\": \"sector\"`, `opportunities/` |\r\n| Three hypotheses + weighted matrix | Compare, decide by consensus or a vote on the matrix criteria | `hypotheses/`, `ledger.json → matrix, selection`, `decisions/` |\r\n| Close | Decisions on record, handoff to Workshop 2 (Go to Market and Brand) | `decisions/`, `sessions/` |\r\n\r\n```\r\n<team folder>/\r\n  ledger.json                team, agenda + shared timer, assignments, matrix criteria, selection\r\n  sector.json                the team's Sector Exploration Pack, parsed (read-only for students)\r\n  findings/F-ana-01.json     one research finding per file (Sprint 1 and Sprint 2)\r\n  opportunities/O-ben-01.json  one possible opportunity per file\r\n  hypotheses/H-carla-01.json   one business hypothesis per file, with its matrix scores\r\n  decisions/D-carla-01.json    one team decision per file\r\n  sessions/2026-10-20.json   one end-of-session handoff per date\r\n  sources/                   original files (the pack .docx, screenshots)\r\n  AGENTS.md                  this file   ·   CLAUDE.md → points here\r\n  .claude/skills/, .agents/skills/   the five skills (the board writes them: ✦ Set up your AI)\r\n```\r\n\r\nStudents may each keep their own copy of the team's work and merge them (the board's **⇄ Share**), or connect the same OneDrive/Google Drive/Dropbox folder. Either way, ids carry the author's name, so work from different people never collides.\r\n\r\n## Rules for editing\r\n\r\n1. **Valid JSON only.** Two-space indent, UTF-8, a trailing newline. If a file won't parse, the board shows a warning and skips it.\r\n2. **The file name is the id, and ids carry their author.** `findings/F-ana-03.json` must contain `\"id\": \"F-ana-03\"`. The pattern is `<letter>-<author>-<nn>`: `F` findings, `O` opportunities, `H` hypotheses, `D` decisions. `<author>` is the person's first name in lowercase ASCII (`José` → `jose`), or `team` if nobody is named. `<nn>` is two digits and goes up by one **per author**: take the highest existing `F-ana-…` and add one. Sessions use the date `YYYY-MM-DD`. Never rename an existing id, because other files point to it.\r\n3. **Edit, don't rewrite.** Change only the fields you mean to change. Keep unknown fields. Set `updatedAt` to the current ISO time: when teammates merge their work, the newer edit of an item wins.\r\n4. **The team decides; AI proposes.** Don't star key factors, shortlist opportunities, score the matrix, choose a hypothesis or log a decision unless the team told you what they decided. You can *suggest*, in chat.\r\n5. **Never invent evidence.** Every source must be real and checkable: publisher, title, year, URL. If you're not sure a source exists or says this, write the claim without a source and say \"source to find\". Never invent numbers.\r\n6. **`verified` means a person opened the source.** Only set `\"verified\": true` (with `verifiedBy` and `verifiedAt`) when a named team member tells you they opened it and it says what the finding claims. You checking it yourself doesn't count. Anything you add starts with `\"verified\": false` and `\"origin\": \"ai\"`.\r\n7. **Lists are arrays of short strings,** one idea per item, with no bullets or numbering inside the strings.\r\n8. **Don't delete what the team rejected.** An opportunity they dropped stays, with `\"shortlisted\": false`. A hypothesis they dropped stays in the matrix. A rejected hypothesis can be hidden with `\"archived\": true`.\r\n\r\n## ledger.json\r\n\r\n(The `//` comments below explain the fields. Real files can't contain comments.)\r\n\r\n```json\r\n{\r\n  \"schema\": \"innovation-sprint-ledger/1\",\r\n  \"team\": {\r\n    \"name\": \"Team 3\",\r\n    \"number\": \"3\",\r\n    \"members\": [{ \"name\": \"Ana\" }, { \"name\": \"Ben\" }],   // 5 or 6 people\r\n    \"leader\": \"Ana\",                                      // the Team Leader: talks to facilitators, keeps time. Not the boss.\r\n    \"agreements\": [\"We decide by consensus; if we can't in 3 minutes, we vote with the matrix criteria.\"]\r\n  },\r\n  \"workshop\": {\r\n    \"current\": 1,\r\n    \"agenda\": [ { \"id\": \"pestel\", \"label\": \"Sprint 1 · PESTEL research\", \"minutes\": 15, \"tab\": \"pestel\" } ],   // 120 minutes in total\r\n    \"timer\": { \"blockId\": \"pestel\", \"startedAt\": \"2026-10-20T14:10:00Z\" }   // shared countdown; blockId \"\" = not started\r\n  },\r\n  \"assignments\": {\r\n    \"pestel\": { \"political\": \"Ana\", \"economic\": \"Ben\", \"social\": \"\", \"technological\": \"\", \"environmental\": \"\", \"legal\": \"\" },\r\n    \"sector\": { \"ecosystem\": \"\", \"valuechain\": \"\", \"frictions\": \"\", \"competition\": \"\", \"segments\": \"\", \"models\": \"\" }\r\n  },\r\n  \"matrix\": {\r\n    \"scale\": 5,                                  // scores are 1 (weak) to 5 (strong); 0 or missing = not scored\r\n    \"criteria\": [ { \"id\": \"evidence\", \"label\": \"Evidence the problem is real\", \"weight\": 25, \"hint\": \"…\" } ]   // weights add up to 100\r\n  },\r\n  \"selection\": {\r\n    \"hypothesisId\": \"H-carla-01\",                        // the chosen hypothesis, \"\" until the team decides\r\n    \"method\": \"consensus\",                       // consensus | vote\r\n    \"votes\": { \"Ana\": \"H-carla-01\", \"Ben\": \"H-ana-01\" },       // only if they voted\r\n    \"rationale\": \"Strongest evidence and a customer we can reach in Miami.\",\r\n    \"decidedAt\": \"2026-10-20T15:45:00Z\"\r\n  },\r\n  \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\nDefault matrix criteria (the team can rename, reweight, add or remove them): evidence the problem is real 25 · clear, reachable customer 15 · size of the opportunity 15 · why now 10 · someone will pay 20 · feasible to launch 15. Matrix score = Σ(weight × score) / (Σweight × scale) × 100.\r\n\r\n## sector.json (the Sector Exploration Pack)\r\n\r\nMade by the board (Brief tab → Load a pack .docx), by `bun kit.ts sector pack.docx`, or by the `pack-to-sector` skill. Students read it, they don't edit it. Fields: `schema: \"sector-pack/1\"`, `id`, `name`, `referenceMarket`, `intro`, `definition`, `inside[]`, `outside[]`, `players[{type, howMoney, examples}]`, `revenueModels[]`, `valueChain{note, steps[{name, actors}], enablingLabel, enabling[]}`, `keyFigures[{level, figure, source}]`, `figuresNote`, `challenge`, `pestelNote`, `sprint2Questions[{dimension, question}]`, `glossary[{term, def}]`, `sources[{group, items[]}]`, `extra[{title, blocks}]` (sections it couldn't map).\r\n\r\nThe pack gives a common starting point. **It doesn't choose the problem, customer, solution, technology or business model.** The team does.\r\n\r\n## findings/F-ben-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"F-ben-01\",\r\n  \"sprint\": \"pestel\",            // pestel | sector\r\n  \"dimension\": \"economic\",       // pestel: political | economic | social | technological | environmental | legal\r\n                                 // sector: ecosystem | valuechain | frictions | competition | segments | models\r\n  \"author\": \"Ben\",               // the team member who owns it (who researched it, or who asked the AI)\r\n  \"title\": \"International arrivals fell in 2025 while domestic travel held\",   // one-line headline\r\n  \"detail\": \"68.3M international arrivals in 2025 vs 72.4M in 2024; NTTO projects ~70.5M in 2026.\",\r\n  \"whoAffected\": \"Operators that depend on overseas visitors\",\r\n  \"implication\": \"Revenue mix is shifting; operators look for ways to win domestic or Latin American demand.\",\r\n  \"sources\": [\r\n    { \"label\": \"NTTO, International Visitor Arrivals\", \"url\": \"https://…\", \"year\": \"2026\",\r\n      \"verified\": false, \"verifiedBy\": \"\", \"verifiedAt\": null,\r\n      \"pack\": false }            // true = cited from the Sector Exploration Pack's key figures (already checked by the organizers)\r\n  ],\r\n  \"origin\": \"team\",              // team | ai\r\n  \"key\": false,                  // Sprint 1 only: the team starred it as a key external factor\r\n  \"notes\": \"\",\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## opportunities/O-ana-01.json\r\n\r\nA specific friction for a clearly defined customer. Not a trend, and not yet a solution.\r\n\r\n```json\r\n{\r\n  \"id\": \"O-ana-01\",\r\n  \"title\": \"Cruise passengers' dead time on embarkation day\",\r\n  \"friction\": \"What goes wrong, or costs time, money or trust\",\r\n  \"who\": \"Who experiences it, as specifically as possible, and how many\",\r\n  \"howSolvedToday\": \"Workarounds and competitors, and what they fail to do\",\r\n  \"whyNow\": \"The external factor (Sprint 1) that makes it urgent\",\r\n  \"evidence\": \"Data, reviews, reports, in words\",\r\n  \"findingIds\": [\"F-ben-03\", \"F-carla-01\"],\r\n  \"sources\": [],\r\n  \"author\": \"Ana\", \"origin\": \"team\",\r\n  \"shortlisted\": false,          // the team shortlisted it for the hypotheses\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## hypotheses/H-ana-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"H-ana-01\", \"order\": 1,\r\n  \"title\": \"Working name\",\r\n  \"customer\": \"\", \"problem\": \"\", \"solution\": \"\", \"valueProp\": \"\", \"revenueModel\": \"\",\r\n  \"businessModel\": \"B2B\",        // B2C | B2B | B2B2C | Platform | Institutional | \"\"\r\n  \"whyNow\": \"\",\r\n  \"launchMarket\": \"Miami-Dade\",  // the Exploration Challenge asks for an initial launch market…\r\n  \"launchMarketWhy\": \"\",         // …justified with data: a figure and its source\r\n  \"openQuestions\": [\"assumptions that must be true and aren't proven yet\"],\r\n  \"opportunityIds\": [\"O-ana-01\"],\r\n  \"sources\": [],\r\n  \"scores\": { \"evidence\": 4, \"customer\": 3 },   // matrix scores by criterion id, set by the TEAM\r\n  \"author\": \"\", \"origin\": \"team\", \"archived\": false,\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## decisions/D-carla-01.json\r\n\r\nEvery sprint closes with a concrete decision.\r\n\r\n```json\r\n{ \"id\": \"D-carla-01\", \"workshop\": 1, \"step\": \"pestel\",   // pestel | sector | opportunities | hypothesis | team | other\r\n  \"decision\": \"Key external factors: …\", \"how\": \"consensus\", \"rationale\": \"\", \"votes\": { \"Ana\": \"H-carla-01\" },\r\n  \"date\": \"2026-10-20\", \"by\": \"Ana\", \"createdAt\": \"…\", \"updatedAt\": \"…\" }\r\n```\r\n\r\n## sessions/2026-10-20.json (end-of-session handoff)\r\n\r\n```json\r\n{\r\n  \"id\": \"2026-10-20\", \"date\": \"2026-10-20\", \"workshop\": 1, \"title\": \"Workshop 1 · Opportunity Discovery\",\r\n  \"decided\": \"What the team decided: the idea, the customer, the launch market\",\r\n  \"evidenceGaps\": \"One per line: what we assumed but haven't proven\",\r\n  \"questionsForNext\": \"One per line: what to ask in Workshop 2\",\r\n  \"nextTask\": \"Before the next workshop, who does what\",\r\n  \"notes\": \"\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## No file access? Hand back JSON\r\n\r\nIn a chat app you can't write files. Instead, finish your answer with one JSON block that the board's **Paste AI answer** buttons read: `{\"findings\":[…]}` on a research card, `{\"opportunities\":[…]}` or `{\"hypotheses\":[…]}` on those tabs (the skills show the exact shapes). The board assigns the ids.\r\n\r\nFor anything else (several kinds of files at once), give one block in the board's sharing format. The student pastes it into **⇄ Share → Add a teammate's work**:\r\n\r\n```json\r\n{ \"schema\": \"innovation-sprint-ledger/1\", \"from\": \"Claude\", \"files\": { \"findings/F-ana-07.json\": { … }, \"decisions/D-ana-02.json\": { … } } }\r\n```\r\n","pack-to-sector/scripts/convert.mjs":"#!/usr/bin/env node\n// Sector Exploration Pack (.docx) → <id>.json. Runs with Node 18+ or Bun, no installs.\n//   node convert.mjs Pack.docx [more.docx…] [--out folder]\nimport { readFileSync, writeFileSync, mkdirSync } from 'node:fs';\nimport { basename, dirname, join, resolve } from 'node:path';\nimport { fileURLToPath, pathToFileURL } from 'node:url';\n\nconst here = dirname(fileURLToPath(import.meta.url));\nawait import(pathToFileURL(join(here, 'pack.js')).href);\nconst SP = globalThis.SectorPack;\nconst args = process.argv.slice(2);\nconst oi = args.indexOf('--out');\nconst out = resolve(oi >= 0 ? args[oi + 1] : '.');\nconst files = args.filter((a, i) => !a.startsWith('--') && args[i - 1] !== '--out');\nif (!files.length) { console.log('Usage: node convert.mjs Pack.docx [more.docx…] [--out folder]'); process.exit(1); }\nmkdirSync(out, { recursive: true });\nfor (const f of files) {\n  const buf = readFileSync(f);\n  const s = await SP.fromDocx(buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength));\n  s.sourceFile = basename(f); s.parsedAt = new Date().toISOString();\n  const p = join(out, s.id + '.json');\n  writeFileSync(p, JSON.stringify(s, null, 2) + '\\n');\n  const probs = SP.check(s);\n  console.log(`${probs.length ? '!' : '✓'} ${s.name} → ${p}`);\n  console.log(`  ${s.keyFigures.length} key figures · ${s.players.length} company types · ${s.valueChain.steps.length} value-chain steps · ${s.sprint2Questions.length} Sprint 2 questions · ${s.glossary.length} glossary terms · ${s.sources.length} source groups`);\n  if (s.extra.length) console.log(`  unmapped sections: ${s.extra.map(x => x.title).join(', ')}`);\n  if (probs.length) console.log(`  check: ${probs.join('; ')}`);\n}\n","pack-to-sector/scripts/pack.js":"/* Sector Exploration Pack (.docx) → sector.json\r\n * Runs in the browser (sprint.html) and in Bun (kit.ts sector). No dependencies:\r\n * a tiny zip reader + DecompressionStream('deflate-raw') + regex over word/document.xml.\r\n * All 8 packs share one layout: a title block, then numbered sections\r\n * (definition, players, value chain, key figures, challenge, guiding questions,\r\n * glossary, sources). Sections are matched by keywords in their heading, not by\r\n * number, and every section also keeps its raw paragraphs and tables, so a pack\r\n * that drifts from the layout still shows up readable on the Brief tab.\r\n */\r\nconst SectorPack = (() => {\r\n  'use strict';\r\n  const SECTOR_SCHEMA = 'sector-pack/1';\r\n\r\n  // ---------- zip ----------\r\n  async function unzipEntry(buf, name) {\r\n    const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);\r\n    let eocd = -1;\r\n    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }\r\n    if (eocd < 0) throw new Error('Not a .docx file (no zip directory found)');\r\n    let p = dv.getUint32(eocd + 16, true);\r\n    const n = dv.getUint16(eocd + 10, true), dec = new TextDecoder();\r\n    for (let k = 0; k < n; k++) {\r\n      if (dv.getUint32(p, true) !== 0x02014b50) break;\r\n      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);\r\n      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);\r\n      const off = dv.getUint32(p + 42, true), fname = dec.decode(u8.subarray(p + 46, p + 46 + nl));\r\n      if (fname === name) {\r\n        const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);\r\n        const data = u8.subarray(start, start + csize);\r\n        if (method === 0) return dec.decode(data);\r\n        if (method !== 8) throw new Error('Unsupported compression in .docx');\r\n        const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));\r\n        return await new Response(stream).text();\r\n      }\r\n      p += 46 + nl + xl + cl;\r\n    }\r\n    throw new Error(name + ' not found in the file');\r\n  }\r\n\r\n  // ---------- docx → blocks ----------\r\n  const ent = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '\"').replace(/&apos;/g, \"'\").replace(/&amp;/g, '&');\r\n  const clean = (s) => ent(s).replace(/\\s+/g, ' ').trim();\r\n  const runText = (xml) => clean((xml.match(/<w:t(?:\\s[^>]*)?>[^<]*<\\/w:t>|<w:tab\\/>|<w:br\\/>/g) || []).map(t => t.startsWith('<w:t') ? t.replace(/<[^>]+>/g, '') : ' ').join(''));\r\n\r\n  function blocks(xml) {\r\n    const body = (/<w:body>([\\s\\S]*)<\\/w:body>/.exec(xml) || [, xml])[1];\r\n    const out = [];\r\n    const re = /<w:tbl>[\\s\\S]*?<\\/w:tbl>|<w:p[ >][\\s\\S]*?<\\/w:p>/g;\r\n    let m;\r\n    while ((m = re.exec(body))) {\r\n      const s = m[0];\r\n      if (s.startsWith('<w:tbl>')) {\r\n        const rows = (s.match(/<w:tr[ >][\\s\\S]*?<\\/w:tr>/g) || []).map(r => (r.match(/<w:tc>[\\s\\S]*?<\\/w:tc>/g) || []).map(c => runText(c)));\r\n        out.push({ t: 'table', rows: rows.filter(r => r.some(Boolean)) });\r\n      } else {\r\n        const text = runText(s);\r\n        if (text) out.push({ t: 'p', text, style: (/<w:pStyle w:val=\"([^\"]+)\"/.exec(s) || [])[1] || '' });\r\n      }\r\n    }\r\n    return out;\r\n  }\r\n\r\n  // ---------- blocks → sector ----------\r\n  const SECTION_KEYS = [\r\n    ['definition', /definition|boundar/i], ['players', /who is in|make money|players|actors/i], ['valueChain', /value chain|journey/i],\r\n    ['keyFigures', /key figures|figures|data/i], ['challenge', /challenge/i], ['questions', /guiding|questions/i],\r\n    ['glossary', /glossary/i], ['sources', /sources/i]\r\n  ];\r\n  const splitDots = (s) => String(s || '').split(/\\s*[·•]\\s*/).map(x => x.trim().replace(/\\.$/, '')).filter(Boolean);\r\n  const slug = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/&/g, ' ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');\r\n  const isHeading = (b) => b.t === 'p' && /^\\d{1,2}\\.\\s+\\S/.test(b.text) && b.text.length < 90 && b.text === b.text.toUpperCase();\r\n\r\n  function parseBlocks(bl) {\r\n    const sector = { schema: SECTOR_SCHEMA, id: '', name: '', label: '', referenceMarket: '', intro: '', definition: '', inside: [], outside: [], players: [], playersNote: '', revenueModels: [],\r\n      valueChain: { note: '', steps: [], enabling: [] }, keyFigures: [], figuresNote: '', challenge: '', pestelNote: '', sprint2Questions: [], glossary: [], sources: [], sections: [], extra: [] };\r\n    let i = 0;\r\n    const head = [];\r\n    while (i < bl.length && !isHeading(bl[i])) head.push(bl[i++]);\r\n    const hp = head.filter(b => b.t === 'p').map(b => b.text);\r\n    sector.label = hp.find(t => /exploration pack|workshop/i.test(t)) || '';\r\n    sector.name = hp.find(t => t !== sector.label && t.length < 80 && t === t.toUpperCase()) || hp.find(t => t !== sector.label) || 'Sector';\r\n    const introP = hp.filter(t => t !== sector.label && t !== sector.name).join(' ');\r\n    const rm = /Reference market:\\s*([^.]*(?:\\([^)]*\\))?[^.]*)\\./i.exec(introP);\r\n    if (rm) sector.referenceMarket = rm[1].trim();\r\n    sector.intro = introP.replace(/^.*?Reference market:[^.]*(?:\\([^)]*\\))?[^.]*\\.\\s*/i, '').trim() || introP;\r\n    sector.name = titleCase(sector.name);\r\n    sector.id = slug(sector.name);\r\n\r\n    while (i < bl.length) {\r\n      const heading = bl[i++].text;\r\n      const items = [];\r\n      while (i < bl.length && !isHeading(bl[i])) items.push(bl[i++]);\r\n      const key = (SECTION_KEYS.find(([, re]) => re.test(heading.replace(/^\\d+\\.\\s*/, ''))) || [])[0] || '';\r\n      const title = titleCase(heading.replace(/^\\d+\\.\\s*/, ''));\r\n      sector.sections.push({ key, title });\r\n      if (!key) sector.extra.push({ title, blocks: items });\r\n      const ps = items.filter(b => b.t === 'p').map(b => b.text), tables = items.filter(b => b.t === 'table');\r\n      try {\r\n        if (key === 'definition') {\r\n          sector.definition = ps[0] || '';\r\n          for (const r of (tables[0] || {}).rows || []) {\r\n            if (/^inside/i.test(r[0])) sector.inside = splitDots(r.slice(1).join(' '));\r\n            if (/^outside/i.test(r[0])) sector.outside = [r.slice(1).join(' ')];\r\n          }\r\n          if (sector.outside.length === 1) {\r\n            const s = sector.outside[0], cut = s.search(/\\.\\s+[A-Z]/);\r\n            const list = cut > 0 ? s.slice(0, cut) : s;\r\n            sector.outside = splitDots(list); if (cut > 0) sector.outsideNote = s.slice(cut + 1).trim();\r\n          }\r\n        } else if (key === 'players') {\r\n          const t = tables[0];\r\n          if (t) sector.players = t.rows.slice(1).map(r => ({ type: r[0] || '', howMoney: r[1] || '', examples: r[2] || '' }));\r\n          sector.playersNote = ps.find(p => !/^revenue models/i.test(p)) || '';\r\n          const rv = ps.find(p => /^revenue models/i.test(p));\r\n          if (rv) sector.revenueModels = splitDots(rv.replace(/^[^:]*:\\s*/, ''));\r\n        } else if (key === 'valueChain') {\r\n          sector.valueChain.note = ps.join(' ');\r\n          const t = tables[0];\r\n          if (t && t.rows.length) {\r\n            const [names, actors = []] = t.rows;\r\n            sector.valueChain.steps = names.map((n, k) => ({ name: n.replace(/^\\d+\\.\\s*/, ''), actors: actors[k] || '' }));\r\n            const en = t.rows.slice(2).map(r => r.filter(Boolean).join(' ')).join(' ');\r\n            if (en) { sector.valueChain.enablingLabel = (/^([^:]+):/.exec(en) || [, 'Enabling layer'])[1]; sector.valueChain.enabling = splitDots(en.replace(/^[^:]*:\\s*/, '')); }\r\n          }\r\n        } else if (key === 'keyFigures') {\r\n          const t = tables[0];\r\n          if (t) sector.keyFigures = t.rows.slice(1).map(r => ({ level: r[0] || '', figure: r[1] || '', source: r[2] || '' }));\r\n          sector.figuresNote = ps.join(' ');\r\n        } else if (key === 'challenge') {\r\n          sector.challenge = ps.join('\\n\\n');\r\n        } else if (key === 'questions') {\r\n          sector.pestelNote = ps.join(' ');\r\n          const t = tables[0];\r\n          if (t) sector.sprint2Questions = t.rows.slice(1).map(r => ({ dimension: r[0] || '', question: r[1] || '' }));\r\n        } else if (key === 'glossary') {\r\n          for (const t of tables) for (const r of t.rows) for (let k = 0; k + 1 < r.length; k += 2) if (r[k]) sector.glossary.push({ term: r[k], def: r[k + 1] || '' });\r\n        } else if (key === 'sources') {\r\n          const all = ps.join(' ');\r\n          const parts = all.split(/\\s*(?=\\b[A-Z][A-Za-z ]{2,30}:\\s)/).filter(Boolean);\r\n          for (const part of parts) {\r\n            const mm = /^([^:]{2,32}):\\s*(.*)$/.exec(part);\r\n            sector.sources.push(mm ? { group: mm[1].trim(), items: splitDots(mm[2]) } : { group: 'Sources', items: splitDots(part) });\r\n          }\r\n        }\r\n      } catch (e) { /* keep the raw section; the Brief tab falls back to it */ }\r\n    }\r\n    return sector;\r\n  }\r\n  function titleCase(s) {\r\n    if (s !== s.toUpperCase()) return s;\r\n    const small = new Set(['and', 'of', 'the', 'in', 'for', 'to', 'a', 'an', 'or', 'on', 'by']);\r\n    return s.toLowerCase().replace(/\\b[\\w']+/g, (w, o) => (o && small.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).replace(/\\bU\\.s\\./g, 'U.S.');\r\n  }\r\n\r\n  async function fromDocx(buf) {\r\n    const xml = await unzipEntry(buf, 'word/document.xml');\r\n    return parseBlocks(blocks(xml));\r\n  }\r\n\r\n  /** Light check used before writing sector.json: returns a list of problems (empty = fine). */\r\n  function check(s) {\r\n    const out = [];\r\n    if (!s || typeof s !== 'object') return ['not an object'];\r\n    if (!s.name) out.push('no sector name');\r\n    if (!s.challenge) out.push('no Exploration Challenge found');\r\n    if (!s.definition) out.push('no sector definition found');\r\n    if (!(s.keyFigures || []).length) out.push('no key figures table found');\r\n    if (!(s.sprint2Questions || []).length) out.push('no Sprint 2 guiding questions found');\r\n    return out;\r\n  }\r\n\r\n  const api = { SECTOR_SCHEMA, fromDocx, parseBlocks, blocks, check, slug };\r\n  if (typeof globalThis !== 'undefined') globalThis.SectorPack = api;\r\n  return api;\r\n})();\r\n","pack-to-sector/SKILL.md":"---\r\nname: pack-to-sector\r\ndescription: Convert a Sector Exploration Pack (the .docx, or PDF, brief that each Innovation Sprint Challenge team receives in Workshop 1) into the sector.json that the Innovation Sprint Ledger board shows on its Brief tab and uses in every research prompt. Use when a facilitator or student says \"load our sector pack\", \"convert these packs\", \"make sector.json from this brief\", or when the board says a pack looks incomplete.\r\n---\r\n\r\n# Sector Exploration Pack → sector.json\r\n\r\nAll the packs share one layout: a title block (\"SECTOR EXPLORATION PACK | WORKSHOP 1\", the sector name, the reference market), then numbered sections: 1 sector definition and boundaries (inside/outside table) · 2 who is in the sector and how they make money (company-type table + revenue models line) · 3 an example value chain (steps table + enabling layer) · 4 key figures (level / figure / source-and-year table) · 5 the Exploration Challenge · 6 guiding questions (PESTEL line + Sprint 2 dimension/starter-question table) · 7 a quick glossary · 8 reliable sources.\r\n\r\nRead `references/SCHEMA.md` → *sector.json* for the fields.\r\n\r\n## Steps\r\n\r\n1. **Run the parser first.** It's deterministic and handles the standard layout:\r\n   ```\r\n   node scripts/convert.mjs path/to/Pack.docx [more.docx…] --out <folder>\r\n   ```\r\n   (`bun scripts/convert.mjs …` works too.) It writes `<folder>/<sector-id>.json` and reports what it found. In the kit, `bun kit.ts sector Pack.docx` does the same and writes into `sectors/`.\r\n2. **Check the report.** Each pack should have about 8–10 key figures, 6–8 company types, 5–7 value-chain steps, **6 Sprint 2 questions** (one per dimension: ecosystem and actors, value chain, processes and frictions, existing solutions and competition, segments and needs, business models), a glossary, and sources. Anything listed under `extra` is a section the parser couldn't map.\r\n3. **If the parser missed something** (the layout drifted, or the pack is a PDF): read the pack yourself and fill in **only** the missing fields, copying the pack's wording exactly. Don't summarise, \"improve\", or add figures. The key figures are the organizers' verified data, so the `figure` and `source` strings must match the pack.\r\n4. **Put it where it's needed:**\r\n   - for one team: save it as `sector.json` in the team folder. Or the student loads the `.docx` (or your `.json`) on the board's Brief tab: no tools needed.\r\n   - for the whole kit (facilitator): save it as `sectors/<id>.json` and run `bun run build`. The rebuilt `sprint.html` lists the sector, so teams just pick it.\r\n5. **Report** the sector name, the counts above, and anything you filled in by hand.\r\n\r\nThe pack deliberately **does not** identify a priority problem, customer, solution, technology or business model. Don't add any of that to sector.json.\r\n","sector-research/references/SCHEMA.md":"# Innovation Sprint Ledger: folder format (schema `innovation-sprint-ledger/1`)\r\n\r\nOne team = one folder of plain JSON files. `sprint.html` (one self-contained page, no server) reads and writes it, and so can you. The page checks the folder every few seconds, so whatever you change shows up on the student's screen on its own.\r\n\r\n## Getting started (agents: read this first)\r\n\r\nWhen a student opens this folder and says something like \"get me started\":\r\n\r\n1. Read `ledger.json` (team, members, assignments, agenda) and `sector.json` (their Sector Exploration Pack). Ask their name if you don't know it. It goes in `author` and in the ids you create.\r\n2. Use the skills in `.claude/skills/` or `.agents/skills/` if your app hasn't loaded them already: `sprint-ledger` (\"where are we?\"), `sector-research` (Sprints 1 and 2), `opportunity-matrix` (opportunities → hypotheses → matrix → decision), `workshop-handoff` (closing the session, Workshop 2 brief).\r\n3. Say in one line where the team is (the first Workshop 1 step that isn't done, see the table below) and offer the next step. Keep it short: they're in a timed workshop.\r\n4. They see your changes on their board (`sprint.html`, opened in Chrome or Edge and connected to this folder) within a few seconds.\r\n\r\nThis is the team's working record for the **Innovation Sprint Challenge** (Spain-US Chamber of Commerce, Miami International Week). Workshop 1, *AI Opportunity Discovery Sprint*, takes the team from a sector to one chosen business hypothesis:\r\n\r\n| Step | Program | Files |\r\n|---|---|---|\r\n| Kick-off | Team Leader, how we'll work, who takes which dimension | `ledger.json → team, assignments` |\r\n| Sprint 1 · PESTEL | Each person takes one dimension. The team stars the key external factors | `findings/` with `\"sprint\": \"pestel\"`, `\"key\": true` |\r\n| Sprint 2 · How the sector works | Each person takes one dimension. The team lists possible opportunities | `findings/` with `\"sprint\": \"sector\"`, `opportunities/` |\r\n| Three hypotheses + weighted matrix | Compare, decide by consensus or a vote on the matrix criteria | `hypotheses/`, `ledger.json → matrix, selection`, `decisions/` |\r\n| Close | Decisions on record, handoff to Workshop 2 (Go to Market and Brand) | `decisions/`, `sessions/` |\r\n\r\n```\r\n<team folder>/\r\n  ledger.json                team, agenda + shared timer, assignments, matrix criteria, selection\r\n  sector.json                the team's Sector Exploration Pack, parsed (read-only for students)\r\n  findings/F-ana-01.json     one research finding per file (Sprint 1 and Sprint 2)\r\n  opportunities/O-ben-01.json  one possible opportunity per file\r\n  hypotheses/H-carla-01.json   one business hypothesis per file, with its matrix scores\r\n  decisions/D-carla-01.json    one team decision per file\r\n  sessions/2026-10-20.json   one end-of-session handoff per date\r\n  sources/                   original files (the pack .docx, screenshots)\r\n  AGENTS.md                  this file   ·   CLAUDE.md → points here\r\n  .claude/skills/, .agents/skills/   the five skills (the board writes them: ✦ Set up your AI)\r\n```\r\n\r\nStudents may each keep their own copy of the team's work and merge them (the board's **⇄ Share**), or connect the same OneDrive/Google Drive/Dropbox folder. Either way, ids carry the author's name, so work from different people never collides.\r\n\r\n## Rules for editing\r\n\r\n1. **Valid JSON only.** Two-space indent, UTF-8, a trailing newline. If a file won't parse, the board shows a warning and skips it.\r\n2. **The file name is the id, and ids carry their author.** `findings/F-ana-03.json` must contain `\"id\": \"F-ana-03\"`. The pattern is `<letter>-<author>-<nn>`: `F` findings, `O` opportunities, `H` hypotheses, `D` decisions. `<author>` is the person's first name in lowercase ASCII (`José` → `jose`), or `team` if nobody is named. `<nn>` is two digits and goes up by one **per author**: take the highest existing `F-ana-…` and add one. Sessions use the date `YYYY-MM-DD`. Never rename an existing id, because other files point to it.\r\n3. **Edit, don't rewrite.** Change only the fields you mean to change. Keep unknown fields. Set `updatedAt` to the current ISO time: when teammates merge their work, the newer edit of an item wins.\r\n4. **The team decides; AI proposes.** Don't star key factors, shortlist opportunities, score the matrix, choose a hypothesis or log a decision unless the team told you what they decided. You can *suggest*, in chat.\r\n5. **Never invent evidence.** Every source must be real and checkable: publisher, title, year, URL. If you're not sure a source exists or says this, write the claim without a source and say \"source to find\". Never invent numbers.\r\n6. **`verified` means a person opened the source.** Only set `\"verified\": true` (with `verifiedBy` and `verifiedAt`) when a named team member tells you they opened it and it says what the finding claims. You checking it yourself doesn't count. Anything you add starts with `\"verified\": false` and `\"origin\": \"ai\"`.\r\n7. **Lists are arrays of short strings,** one idea per item, with no bullets or numbering inside the strings.\r\n8. **Don't delete what the team rejected.** An opportunity they dropped stays, with `\"shortlisted\": false`. A hypothesis they dropped stays in the matrix. A rejected hypothesis can be hidden with `\"archived\": true`.\r\n\r\n## ledger.json\r\n\r\n(The `//` comments below explain the fields. Real files can't contain comments.)\r\n\r\n```json\r\n{\r\n  \"schema\": \"innovation-sprint-ledger/1\",\r\n  \"team\": {\r\n    \"name\": \"Team 3\",\r\n    \"number\": \"3\",\r\n    \"members\": [{ \"name\": \"Ana\" }, { \"name\": \"Ben\" }],   // 5 or 6 people\r\n    \"leader\": \"Ana\",                                      // the Team Leader: talks to facilitators, keeps time. Not the boss.\r\n    \"agreements\": [\"We decide by consensus; if we can't in 3 minutes, we vote with the matrix criteria.\"]\r\n  },\r\n  \"workshop\": {\r\n    \"current\": 1,\r\n    \"agenda\": [ { \"id\": \"pestel\", \"label\": \"Sprint 1 · PESTEL research\", \"minutes\": 15, \"tab\": \"pestel\" } ],   // 120 minutes in total\r\n    \"timer\": { \"blockId\": \"pestel\", \"startedAt\": \"2026-10-20T14:10:00Z\" }   // shared countdown; blockId \"\" = not started\r\n  },\r\n  \"assignments\": {\r\n    \"pestel\": { \"political\": \"Ana\", \"economic\": \"Ben\", \"social\": \"\", \"technological\": \"\", \"environmental\": \"\", \"legal\": \"\" },\r\n    \"sector\": { \"ecosystem\": \"\", \"valuechain\": \"\", \"frictions\": \"\", \"competition\": \"\", \"segments\": \"\", \"models\": \"\" }\r\n  },\r\n  \"matrix\": {\r\n    \"scale\": 5,                                  // scores are 1 (weak) to 5 (strong); 0 or missing = not scored\r\n    \"criteria\": [ { \"id\": \"evidence\", \"label\": \"Evidence the problem is real\", \"weight\": 25, \"hint\": \"…\" } ]   // weights add up to 100\r\n  },\r\n  \"selection\": {\r\n    \"hypothesisId\": \"H-carla-01\",                        // the chosen hypothesis, \"\" until the team decides\r\n    \"method\": \"consensus\",                       // consensus | vote\r\n    \"votes\": { \"Ana\": \"H-carla-01\", \"Ben\": \"H-ana-01\" },       // only if they voted\r\n    \"rationale\": \"Strongest evidence and a customer we can reach in Miami.\",\r\n    \"decidedAt\": \"2026-10-20T15:45:00Z\"\r\n  },\r\n  \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\nDefault matrix criteria (the team can rename, reweight, add or remove them): evidence the problem is real 25 · clear, reachable customer 15 · size of the opportunity 15 · why now 10 · someone will pay 20 · feasible to launch 15. Matrix score = Σ(weight × score) / (Σweight × scale) × 100.\r\n\r\n## sector.json (the Sector Exploration Pack)\r\n\r\nMade by the board (Brief tab → Load a pack .docx), by `bun kit.ts sector pack.docx`, or by the `pack-to-sector` skill. Students read it, they don't edit it. Fields: `schema: \"sector-pack/1\"`, `id`, `name`, `referenceMarket`, `intro`, `definition`, `inside[]`, `outside[]`, `players[{type, howMoney, examples}]`, `revenueModels[]`, `valueChain{note, steps[{name, actors}], enablingLabel, enabling[]}`, `keyFigures[{level, figure, source}]`, `figuresNote`, `challenge`, `pestelNote`, `sprint2Questions[{dimension, question}]`, `glossary[{term, def}]`, `sources[{group, items[]}]`, `extra[{title, blocks}]` (sections it couldn't map).\r\n\r\nThe pack gives a common starting point. **It doesn't choose the problem, customer, solution, technology or business model.** The team does.\r\n\r\n## findings/F-ben-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"F-ben-01\",\r\n  \"sprint\": \"pestel\",            // pestel | sector\r\n  \"dimension\": \"economic\",       // pestel: political | economic | social | technological | environmental | legal\r\n                                 // sector: ecosystem | valuechain | frictions | competition | segments | models\r\n  \"author\": \"Ben\",               // the team member who owns it (who researched it, or who asked the AI)\r\n  \"title\": \"International arrivals fell in 2025 while domestic travel held\",   // one-line headline\r\n  \"detail\": \"68.3M international arrivals in 2025 vs 72.4M in 2024; NTTO projects ~70.5M in 2026.\",\r\n  \"whoAffected\": \"Operators that depend on overseas visitors\",\r\n  \"implication\": \"Revenue mix is shifting; operators look for ways to win domestic or Latin American demand.\",\r\n  \"sources\": [\r\n    { \"label\": \"NTTO, International Visitor Arrivals\", \"url\": \"https://…\", \"year\": \"2026\",\r\n      \"verified\": false, \"verifiedBy\": \"\", \"verifiedAt\": null,\r\n      \"pack\": false }            // true = cited from the Sector Exploration Pack's key figures (already checked by the organizers)\r\n  ],\r\n  \"origin\": \"team\",              // team | ai\r\n  \"key\": false,                  // Sprint 1 only: the team starred it as a key external factor\r\n  \"notes\": \"\",\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## opportunities/O-ana-01.json\r\n\r\nA specific friction for a clearly defined customer. Not a trend, and not yet a solution.\r\n\r\n```json\r\n{\r\n  \"id\": \"O-ana-01\",\r\n  \"title\": \"Cruise passengers' dead time on embarkation day\",\r\n  \"friction\": \"What goes wrong, or costs time, money or trust\",\r\n  \"who\": \"Who experiences it, as specifically as possible, and how many\",\r\n  \"howSolvedToday\": \"Workarounds and competitors, and what they fail to do\",\r\n  \"whyNow\": \"The external factor (Sprint 1) that makes it urgent\",\r\n  \"evidence\": \"Data, reviews, reports, in words\",\r\n  \"findingIds\": [\"F-ben-03\", \"F-carla-01\"],\r\n  \"sources\": [],\r\n  \"author\": \"Ana\", \"origin\": \"team\",\r\n  \"shortlisted\": false,          // the team shortlisted it for the hypotheses\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## hypotheses/H-ana-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"H-ana-01\", \"order\": 1,\r\n  \"title\": \"Working name\",\r\n  \"customer\": \"\", \"problem\": \"\", \"solution\": \"\", \"valueProp\": \"\", \"revenueModel\": \"\",\r\n  \"businessModel\": \"B2B\",        // B2C | B2B | B2B2C | Platform | Institutional | \"\"\r\n  \"whyNow\": \"\",\r\n  \"launchMarket\": \"Miami-Dade\",  // the Exploration Challenge asks for an initial launch market…\r\n  \"launchMarketWhy\": \"\",         // …justified with data: a figure and its source\r\n  \"openQuestions\": [\"assumptions that must be true and aren't proven yet\"],\r\n  \"opportunityIds\": [\"O-ana-01\"],\r\n  \"sources\": [],\r\n  \"scores\": { \"evidence\": 4, \"customer\": 3 },   // matrix scores by criterion id, set by the TEAM\r\n  \"author\": \"\", \"origin\": \"team\", \"archived\": false,\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## decisions/D-carla-01.json\r\n\r\nEvery sprint closes with a concrete decision.\r\n\r\n```json\r\n{ \"id\": \"D-carla-01\", \"workshop\": 1, \"step\": \"pestel\",   // pestel | sector | opportunities | hypothesis | team | other\r\n  \"decision\": \"Key external factors: …\", \"how\": \"consensus\", \"rationale\": \"\", \"votes\": { \"Ana\": \"H-carla-01\" },\r\n  \"date\": \"2026-10-20\", \"by\": \"Ana\", \"createdAt\": \"…\", \"updatedAt\": \"…\" }\r\n```\r\n\r\n## sessions/2026-10-20.json (end-of-session handoff)\r\n\r\n```json\r\n{\r\n  \"id\": \"2026-10-20\", \"date\": \"2026-10-20\", \"workshop\": 1, \"title\": \"Workshop 1 · Opportunity Discovery\",\r\n  \"decided\": \"What the team decided: the idea, the customer, the launch market\",\r\n  \"evidenceGaps\": \"One per line: what we assumed but haven't proven\",\r\n  \"questionsForNext\": \"One per line: what to ask in Workshop 2\",\r\n  \"nextTask\": \"Before the next workshop, who does what\",\r\n  \"notes\": \"\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## No file access? Hand back JSON\r\n\r\nIn a chat app you can't write files. Instead, finish your answer with one JSON block that the board's **Paste AI answer** buttons read: `{\"findings\":[…]}` on a research card, `{\"opportunities\":[…]}` or `{\"hypotheses\":[…]}` on those tabs (the skills show the exact shapes). The board assigns the ids.\r\n\r\nFor anything else (several kinds of files at once), give one block in the board's sharing format. The student pastes it into **⇄ Share → Add a teammate's work**:\r\n\r\n```json\r\n{ \"schema\": \"innovation-sprint-ledger/1\", \"from\": \"Claude\", \"files\": { \"findings/F-ana-07.json\": { … }, \"decisions/D-ana-02.json\": { … } } }\r\n```\r\n","sector-research/SKILL.md":"---\r\nname: sector-research\r\ndescription: Research one dimension of a sector for the Innovation Sprint Challenge, Workshop 1, and write the findings, with real sources, into the team's Innovation Sprint Ledger. Covers Sprint 1 (PESTEL; each team member takes one of political, economic, social, technological, environmental, legal) and Sprint 2 (how the sector works: ecosystem and actors, value chain, processes and frictions, existing solutions and competition, segments and needs, business models and monetization). Use when a student says \"research the economic dimension\", \"do my PESTEL part\", \"Sprint 2 value chain for our sector\", \"find evidence for this friction\", \"check these findings\", or pastes a starter question from their Sector Exploration Pack.\r\n---\r\n\r\n# One dimension → findings with sources\r\n\r\nYou're helping **one team member** with **their** dimension in a time-boxed sprint (about 15 minutes in Sprint 1, 20 in Sprint 2). Speed matters, but the program's point is that AI speeds up research **without replacing the team's reasoning**. Your findings are drafts that the student reads, questions, and checks.\r\n\r\nRead `references/SCHEMA.md` for the file format. Read `sector.json` in the team folder for the sector definition, its limits (inside/outside), the reference market, the Exploration Challenge, the key figures, the reliable sources and the Sprint 2 starter questions. If there's no `sector.json`, ask which sector pack they have. Don't guess the sector's limits.\r\n\r\n## Steps\r\n\r\n1. **Pin the scope.** Which sprint (PESTEL or sector) and which dimension? Check `ledger.json → assignments` to see if it's assigned to them. Ask their name if you don't know it (it goes in `author`).\r\n2. **Research.** Answer:\r\n   - **Sprint 1 · PESTEL:** what in this dimension is **changing** (the last 2 years and the next 3) that affects this sector in the U.S. and especially the reference market? Who does it affect?\r\n   - **Sprint 2:** the pack's starter question for this dimension (`sector.json → sprint2Questions`), plus: what do people still do manually or work around? Where do customers or operators lose time, money or trust? What do today's solutions fail to do? Who captures the margin?\r\n   - Stay **inside** the sector's limits. Things listed under *outside* can appear as partners or channels only.\r\n   - **Sprint 2 isn't the time to choose a customer or a solution.** Describe problems, who has them, how they're solved today, and the evidence.\r\n3. **Write 4–6 findings** to `findings/F-<student>-<nn>.json`, one per file (`F-ana-01`, `F-ana-02`…, continuing from the student's highest number; see SCHEMA.md). Fields: `sprint`, `dimension`, `author` (the student), `title` (one-line headline), `detail` (with the number and date), `whoAffected`, `implication` (why it might matter, with no business idea yet), `sources[]`, `origin: \"ai\"`, `key: false`.\r\n4. **Sources, honestly.**\r\n   - Every source is real and checkable: `label` (\"Publisher, title\"), `url`, `year`. Prefer the pack's reliable sources and primary data (government statistics, industry associations, company 10-Ks).\r\n   - Every source starts as `\"verified\": false`. **Never set it to true yourself.** Only a person who opened the source and saw the claim can.\r\n   - Not sure a source exists or says this? Leave the finding without that source and write `Source to find: …` in `notes`. Never invent a number, a URL or a report title.\r\n   - A figure from the pack's `keyFigures` can be cited with `\"pack\": true, \"verified\": true, \"verifiedBy\": \"Sector Exploration Pack\"`, because the organizers already checked it.\r\n   - Flag estimates, preliminary data, and anything more than two years old in `notes`.\r\n5. **Hand it back** in a few lines:\r\n   - **Written:** the file ids and their headlines.\r\n   - **Check these first:** the 2–3 sources the findings rely on most, with their links. Ask the student to open them and tell you what they found. If they confirm one, set `verified: true`, `verifiedBy: <their name>`, `verifiedAt: <now>`.\r\n   - **Weak spots:** contradictions between sources, missing data, and claims that rest on one source only.\r\n   - **One question for the team discussion**, for example: \"Is this a trend, or a problem someone would pay to fix?\"\r\n\r\n## Sprint 1 only: key factors\r\n\r\nWhen the team shares results, it picks the external factors that matter most. **The team** stars them (`\"key\": true`). If they ask for your view, rank the candidates by (a) how directly they affect a definable customer, (b) the strength of the evidence, and (c) how fast they're changing. Then let them decide.\r\n\r\n## No file access (chat app)?\r\n\r\nAnswer in plain text, then end with one JSON block that the board can import: on the dimension's card, **2 · Paste AI answer** reads this shape:\r\n\r\n```json\r\n{\"findings\":[{\"title\":\"\",\"detail\":\"\",\"whoAffected\":\"\",\"implication\":\"\",\"sources\":[{\"label\":\"Publisher, title\",\"url\":\"https://…\",\"year\":\"2026\"}]}]}\r\n```\r\n\r\n## Checking findings someone else wrote\r\n\r\nIf they ask you to review findings: for each one, say whether the source supports the claim as written (if you can open it), whether it's a fact or an interpretation, and what would disconfirm it. Don't flip `verified`. Tell them what to look for when they open the source.\r\n","sprint-ledger/references/SCHEMA.md":"# Innovation Sprint Ledger: folder format (schema `innovation-sprint-ledger/1`)\r\n\r\nOne team = one folder of plain JSON files. `sprint.html` (one self-contained page, no server) reads and writes it, and so can you. The page checks the folder every few seconds, so whatever you change shows up on the student's screen on its own.\r\n\r\n## Getting started (agents: read this first)\r\n\r\nWhen a student opens this folder and says something like \"get me started\":\r\n\r\n1. Read `ledger.json` (team, members, assignments, agenda) and `sector.json` (their Sector Exploration Pack). Ask their name if you don't know it. It goes in `author` and in the ids you create.\r\n2. Use the skills in `.claude/skills/` or `.agents/skills/` if your app hasn't loaded them already: `sprint-ledger` (\"where are we?\"), `sector-research` (Sprints 1 and 2), `opportunity-matrix` (opportunities → hypotheses → matrix → decision), `workshop-handoff` (closing the session, Workshop 2 brief).\r\n3. Say in one line where the team is (the first Workshop 1 step that isn't done, see the table below) and offer the next step. Keep it short: they're in a timed workshop.\r\n4. They see your changes on their board (`sprint.html`, opened in Chrome or Edge and connected to this folder) within a few seconds.\r\n\r\nThis is the team's working record for the **Innovation Sprint Challenge** (Spain-US Chamber of Commerce, Miami International Week). Workshop 1, *AI Opportunity Discovery Sprint*, takes the team from a sector to one chosen business hypothesis:\r\n\r\n| Step | Program | Files |\r\n|---|---|---|\r\n| Kick-off | Team Leader, how we'll work, who takes which dimension | `ledger.json → team, assignments` |\r\n| Sprint 1 · PESTEL | Each person takes one dimension. The team stars the key external factors | `findings/` with `\"sprint\": \"pestel\"`, `\"key\": true` |\r\n| Sprint 2 · How the sector works | Each person takes one dimension. The team lists possible opportunities | `findings/` with `\"sprint\": \"sector\"`, `opportunities/` |\r\n| Three hypotheses + weighted matrix | Compare, decide by consensus or a vote on the matrix criteria | `hypotheses/`, `ledger.json → matrix, selection`, `decisions/` |\r\n| Close | Decisions on record, handoff to Workshop 2 (Go to Market and Brand) | `decisions/`, `sessions/` |\r\n\r\n```\r\n<team folder>/\r\n  ledger.json                team, agenda + shared timer, assignments, matrix criteria, selection\r\n  sector.json                the team's Sector Exploration Pack, parsed (read-only for students)\r\n  findings/F-ana-01.json     one research finding per file (Sprint 1 and Sprint 2)\r\n  opportunities/O-ben-01.json  one possible opportunity per file\r\n  hypotheses/H-carla-01.json   one business hypothesis per file, with its matrix scores\r\n  decisions/D-carla-01.json    one team decision per file\r\n  sessions/2026-10-20.json   one end-of-session handoff per date\r\n  sources/                   original files (the pack .docx, screenshots)\r\n  AGENTS.md                  this file   ·   CLAUDE.md → points here\r\n  .claude/skills/, .agents/skills/   the five skills (the board writes them: ✦ Set up your AI)\r\n```\r\n\r\nStudents may each keep their own copy of the team's work and merge them (the board's **⇄ Share**), or connect the same OneDrive/Google Drive/Dropbox folder. Either way, ids carry the author's name, so work from different people never collides.\r\n\r\n## Rules for editing\r\n\r\n1. **Valid JSON only.** Two-space indent, UTF-8, a trailing newline. If a file won't parse, the board shows a warning and skips it.\r\n2. **The file name is the id, and ids carry their author.** `findings/F-ana-03.json` must contain `\"id\": \"F-ana-03\"`. The pattern is `<letter>-<author>-<nn>`: `F` findings, `O` opportunities, `H` hypotheses, `D` decisions. `<author>` is the person's first name in lowercase ASCII (`José` → `jose`), or `team` if nobody is named. `<nn>` is two digits and goes up by one **per author**: take the highest existing `F-ana-…` and add one. Sessions use the date `YYYY-MM-DD`. Never rename an existing id, because other files point to it.\r\n3. **Edit, don't rewrite.** Change only the fields you mean to change. Keep unknown fields. Set `updatedAt` to the current ISO time: when teammates merge their work, the newer edit of an item wins.\r\n4. **The team decides; AI proposes.** Don't star key factors, shortlist opportunities, score the matrix, choose a hypothesis or log a decision unless the team told you what they decided. You can *suggest*, in chat.\r\n5. **Never invent evidence.** Every source must be real and checkable: publisher, title, year, URL. If you're not sure a source exists or says this, write the claim without a source and say \"source to find\". Never invent numbers.\r\n6. **`verified` means a person opened the source.** Only set `\"verified\": true` (with `verifiedBy` and `verifiedAt`) when a named team member tells you they opened it and it says what the finding claims. You checking it yourself doesn't count. Anything you add starts with `\"verified\": false` and `\"origin\": \"ai\"`.\r\n7. **Lists are arrays of short strings,** one idea per item, with no bullets or numbering inside the strings.\r\n8. **Don't delete what the team rejected.** An opportunity they dropped stays, with `\"shortlisted\": false`. A hypothesis they dropped stays in the matrix. A rejected hypothesis can be hidden with `\"archived\": true`.\r\n\r\n## ledger.json\r\n\r\n(The `//` comments below explain the fields. Real files can't contain comments.)\r\n\r\n```json\r\n{\r\n  \"schema\": \"innovation-sprint-ledger/1\",\r\n  \"team\": {\r\n    \"name\": \"Team 3\",\r\n    \"number\": \"3\",\r\n    \"members\": [{ \"name\": \"Ana\" }, { \"name\": \"Ben\" }],   // 5 or 6 people\r\n    \"leader\": \"Ana\",                                      // the Team Leader: talks to facilitators, keeps time. Not the boss.\r\n    \"agreements\": [\"We decide by consensus; if we can't in 3 minutes, we vote with the matrix criteria.\"]\r\n  },\r\n  \"workshop\": {\r\n    \"current\": 1,\r\n    \"agenda\": [ { \"id\": \"pestel\", \"label\": \"Sprint 1 · PESTEL research\", \"minutes\": 15, \"tab\": \"pestel\" } ],   // 120 minutes in total\r\n    \"timer\": { \"blockId\": \"pestel\", \"startedAt\": \"2026-10-20T14:10:00Z\" }   // shared countdown; blockId \"\" = not started\r\n  },\r\n  \"assignments\": {\r\n    \"pestel\": { \"political\": \"Ana\", \"economic\": \"Ben\", \"social\": \"\", \"technological\": \"\", \"environmental\": \"\", \"legal\": \"\" },\r\n    \"sector\": { \"ecosystem\": \"\", \"valuechain\": \"\", \"frictions\": \"\", \"competition\": \"\", \"segments\": \"\", \"models\": \"\" }\r\n  },\r\n  \"matrix\": {\r\n    \"scale\": 5,                                  // scores are 1 (weak) to 5 (strong); 0 or missing = not scored\r\n    \"criteria\": [ { \"id\": \"evidence\", \"label\": \"Evidence the problem is real\", \"weight\": 25, \"hint\": \"…\" } ]   // weights add up to 100\r\n  },\r\n  \"selection\": {\r\n    \"hypothesisId\": \"H-carla-01\",                        // the chosen hypothesis, \"\" until the team decides\r\n    \"method\": \"consensus\",                       // consensus | vote\r\n    \"votes\": { \"Ana\": \"H-carla-01\", \"Ben\": \"H-ana-01\" },       // only if they voted\r\n    \"rationale\": \"Strongest evidence and a customer we can reach in Miami.\",\r\n    \"decidedAt\": \"2026-10-20T15:45:00Z\"\r\n  },\r\n  \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\nDefault matrix criteria (the team can rename, reweight, add or remove them): evidence the problem is real 25 · clear, reachable customer 15 · size of the opportunity 15 · why now 10 · someone will pay 20 · feasible to launch 15. Matrix score = Σ(weight × score) / (Σweight × scale) × 100.\r\n\r\n## sector.json (the Sector Exploration Pack)\r\n\r\nMade by the board (Brief tab → Load a pack .docx), by `bun kit.ts sector pack.docx`, or by the `pack-to-sector` skill. Students read it, they don't edit it. Fields: `schema: \"sector-pack/1\"`, `id`, `name`, `referenceMarket`, `intro`, `definition`, `inside[]`, `outside[]`, `players[{type, howMoney, examples}]`, `revenueModels[]`, `valueChain{note, steps[{name, actors}], enablingLabel, enabling[]}`, `keyFigures[{level, figure, source}]`, `figuresNote`, `challenge`, `pestelNote`, `sprint2Questions[{dimension, question}]`, `glossary[{term, def}]`, `sources[{group, items[]}]`, `extra[{title, blocks}]` (sections it couldn't map).\r\n\r\nThe pack gives a common starting point. **It doesn't choose the problem, customer, solution, technology or business model.** The team does.\r\n\r\n## findings/F-ben-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"F-ben-01\",\r\n  \"sprint\": \"pestel\",            // pestel | sector\r\n  \"dimension\": \"economic\",       // pestel: political | economic | social | technological | environmental | legal\r\n                                 // sector: ecosystem | valuechain | frictions | competition | segments | models\r\n  \"author\": \"Ben\",               // the team member who owns it (who researched it, or who asked the AI)\r\n  \"title\": \"International arrivals fell in 2025 while domestic travel held\",   // one-line headline\r\n  \"detail\": \"68.3M international arrivals in 2025 vs 72.4M in 2024; NTTO projects ~70.5M in 2026.\",\r\n  \"whoAffected\": \"Operators that depend on overseas visitors\",\r\n  \"implication\": \"Revenue mix is shifting; operators look for ways to win domestic or Latin American demand.\",\r\n  \"sources\": [\r\n    { \"label\": \"NTTO, International Visitor Arrivals\", \"url\": \"https://…\", \"year\": \"2026\",\r\n      \"verified\": false, \"verifiedBy\": \"\", \"verifiedAt\": null,\r\n      \"pack\": false }            // true = cited from the Sector Exploration Pack's key figures (already checked by the organizers)\r\n  ],\r\n  \"origin\": \"team\",              // team | ai\r\n  \"key\": false,                  // Sprint 1 only: the team starred it as a key external factor\r\n  \"notes\": \"\",\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## opportunities/O-ana-01.json\r\n\r\nA specific friction for a clearly defined customer. Not a trend, and not yet a solution.\r\n\r\n```json\r\n{\r\n  \"id\": \"O-ana-01\",\r\n  \"title\": \"Cruise passengers' dead time on embarkation day\",\r\n  \"friction\": \"What goes wrong, or costs time, money or trust\",\r\n  \"who\": \"Who experiences it, as specifically as possible, and how many\",\r\n  \"howSolvedToday\": \"Workarounds and competitors, and what they fail to do\",\r\n  \"whyNow\": \"The external factor (Sprint 1) that makes it urgent\",\r\n  \"evidence\": \"Data, reviews, reports, in words\",\r\n  \"findingIds\": [\"F-ben-03\", \"F-carla-01\"],\r\n  \"sources\": [],\r\n  \"author\": \"Ana\", \"origin\": \"team\",\r\n  \"shortlisted\": false,          // the team shortlisted it for the hypotheses\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## hypotheses/H-ana-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"H-ana-01\", \"order\": 1,\r\n  \"title\": \"Working name\",\r\n  \"customer\": \"\", \"problem\": \"\", \"solution\": \"\", \"valueProp\": \"\", \"revenueModel\": \"\",\r\n  \"businessModel\": \"B2B\",        // B2C | B2B | B2B2C | Platform | Institutional | \"\"\r\n  \"whyNow\": \"\",\r\n  \"launchMarket\": \"Miami-Dade\",  // the Exploration Challenge asks for an initial launch market…\r\n  \"launchMarketWhy\": \"\",         // …justified with data: a figure and its source\r\n  \"openQuestions\": [\"assumptions that must be true and aren't proven yet\"],\r\n  \"opportunityIds\": [\"O-ana-01\"],\r\n  \"sources\": [],\r\n  \"scores\": { \"evidence\": 4, \"customer\": 3 },   // matrix scores by criterion id, set by the TEAM\r\n  \"author\": \"\", \"origin\": \"team\", \"archived\": false,\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## decisions/D-carla-01.json\r\n\r\nEvery sprint closes with a concrete decision.\r\n\r\n```json\r\n{ \"id\": \"D-carla-01\", \"workshop\": 1, \"step\": \"pestel\",   // pestel | sector | opportunities | hypothesis | team | other\r\n  \"decision\": \"Key external factors: …\", \"how\": \"consensus\", \"rationale\": \"\", \"votes\": { \"Ana\": \"H-carla-01\" },\r\n  \"date\": \"2026-10-20\", \"by\": \"Ana\", \"createdAt\": \"…\", \"updatedAt\": \"…\" }\r\n```\r\n\r\n## sessions/2026-10-20.json (end-of-session handoff)\r\n\r\n```json\r\n{\r\n  \"id\": \"2026-10-20\", \"date\": \"2026-10-20\", \"workshop\": 1, \"title\": \"Workshop 1 · Opportunity Discovery\",\r\n  \"decided\": \"What the team decided: the idea, the customer, the launch market\",\r\n  \"evidenceGaps\": \"One per line: what we assumed but haven't proven\",\r\n  \"questionsForNext\": \"One per line: what to ask in Workshop 2\",\r\n  \"nextTask\": \"Before the next workshop, who does what\",\r\n  \"notes\": \"\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## No file access? Hand back JSON\r\n\r\nIn a chat app you can't write files. Instead, finish your answer with one JSON block that the board's **Paste AI answer** buttons read: `{\"findings\":[…]}` on a research card, `{\"opportunities\":[…]}` or `{\"hypotheses\":[…]}` on those tabs (the skills show the exact shapes). The board assigns the ids.\r\n\r\nFor anything else (several kinds of files at once), give one block in the board's sharing format. The student pastes it into **⇄ Share → Add a teammate's work**:\r\n\r\n```json\r\n{ \"schema\": \"innovation-sprint-ledger/1\", \"from\": \"Claude\", \"files\": { \"findings/F-ana-07.json\": { … }, \"decisions/D-ana-02.json\": { … } } }\r\n```\r\n","sprint-ledger/SKILL.md":"---\nname: sprint-ledger\ndescription: Get an Innovation Sprint Challenge team started, and keep them oriented. Use when a student says \"get me started\", \"set me up\", \"read AGENTS.md\", \"where are we?\", \"what's next?\", or asks how the board (sprint.html), the team folder (ledger.json, sector.json, findings/, opportunities/, hypotheses/, decisions/, sessions/) or sharing work with teammates works. Part of the Innovation Sprint Ledger for the Spain-US Chamber of Commerce's Miami International Week. For research use sector-research; for opportunities, hypotheses and the weighted matrix use opportunity-matrix; for closing the session use workshop-handoff; for converting a pack .docx use pack-to-sector.\n---\n\n# Innovation Sprint Ledger: start here\n\nThe ledger is a team's working record for the Innovation Sprint Challenge. It has two parts: **one self-contained page** (`sprint.html`, the board) and, optionally, **one folder of JSON files** that the board and you both read and write. There's no server, no account, and nothing to install. The students are MBA students, not developers. Never ask them to run commands or install anything.\n\nRead `references/SCHEMA.md` (or `AGENTS.md` in their folder) before you write any file. It is the contract.\n\n## The program, in one screen\n\n8 teams of 5–6 MBA students, 4 sectors (2 teams per sector), four sessions:\n\n| Session | Question | Output |\n|---|---|---|\n| **Workshop 1 · AI Opportunity Discovery Sprint** (2 h) | Which opportunity is worth pursuing? | Chosen opportunity + business hypothesis |\n| Workshop 2 · Go to Market and Brand Sprint | How will it reach the market? | Positioning, brand, go-to-market |\n| Workshop 3 · Design the Money Engine | Can it be a viable business? | Basic financial model + funding ask |\n| Workshop 4 + Demo Day · Pitch Perfect | Can the team defend it? | 12-slide, 8-minute pitch + 5 min jury Q&A |\n\nThis ledger covers **Workshop 1** and hands off to Workshop 2. AI speeds up the work; it doesn't replace the team's reasoning. The jury scores the quality of the opportunity, the **evidence**, customer–solution fit, and whether **every** member can explain and defend the decisions.\n\n## \"Get me started\"\n\n**If you're working in their folder** (it has `ledger.json` or `AGENTS.md`):\n\n1. Read `ledger.json` and `sector.json`. Ask their name if you don't know it (it goes in ids and `author`).\n2. If there's no `sector.json`, ask them to pick their sector on the board's **Brief** tab. It's one click, or they drop in the pack `.docx`. If they gave you the `.docx`, use the pack-to-sector skill. Never write a sector.json from memory.\n3. If the team has no members or Team Leader yet, ask for them and write them to `ledger.json → team`.\n4. Then do \"Where are we?\" (below), and offer the next step.\n\n**If the folder is empty or new:** create `findings/`, `opportunities/`, `hypotheses/`, `decisions/`, `sessions/`, `sources/`; write a `ledger.json` containing only what they told you (team name, members); copy `references/SCHEMA.md` to `AGENTS.md`; and write a `CLAUDE.md` containing `@AGENTS.md`. The board fills in the defaults (agenda, matrix criteria) the first time it opens the folder. Tell them to open `sprint.html` in Chrome or Edge → **✦ Set up your AI** → **Connect a folder** → pick this folder.\n\n**If you can't write files** (a chat app): you're their guide in the chat. They work on the board, and you hand back JSON blocks that they paste in with **Paste AI answer** (see the other skills). If they don't have the board yet, it's the `sprint.html` file their facilitator gave them. They open it in a browser; no install.\n\n## \"Where are we?\" (any time during the workshop)\n\n1. Read `ledger.json → workshop.timer` and `agenda`: say which block is running and how many minutes are left. A block's time left is `minutes × 60 − (now − startedAt)`.\n2. Check the Workshop 1 steps in order and report the **first one not done**, in one line:\n   Team Leader chosen → PESTEL findings in all 6 dimensions → ≥3 key factors starred → Sprint 2 findings in all 6 dimensions → ≥3 opportunities → 3 hypotheses with customer, problem, solution, value proposition and revenue model → every matrix cell scored → hypothesis chosen and decision logged → launch market justified with data.\n3. Count sources with `verified: false` and findings with no source. Mention them if there are any.\n4. Recommend **one** next action. If time is nearly up: \"Close the block with a decision. Don't extend it to perfect it.\" (Program rule: every phase closes with concrete decisions.)\n\n## How a team shares one board (explain it only if asked)\n\n- **Team Leader collects:** each person clicks **⇄ Share → Share my work** and sends it (WhatsApp, Teams, email). The Team Leader clicks **Add a teammate's work** for each one, then shares the merged board back. Adding the same work twice is harmless.\n- **One shared folder:** if everyone has OneDrive, Google Drive or Dropbox on their laptop, they all **Connect a folder** to the same synced folder, and work shows up on everyone's board by itself.\n- **One person drives:** one laptop holds the board, and the others research and dictate.\n\nIds carry the author's name (`F-ana-03`), which is why merging never collides. Keep that pattern when you create files.\n\n## When you edit files\n\n- Follow SCHEMA.md. What matters most: valid JSON, file name = id with the author's name in it, change only the fields you mean to, never invent evidence, and never mark a source verified yourself.\n- After editing, say which files you changed in one line, for example: \"Added findings/F-ben-04 and F-ben-05 (Economic, both sources unchecked).\"\n- The team decides; you propose. Don't star, shortlist, score, choose or log decisions unless they told you what they decided.\n\n## Tone\n\nThey're MBA students under time pressure, often working in their second language. Be brief and concrete. Push back when something isn't backed by evidence, and say so plainly.\n","workshop-handoff/references/SCHEMA.md":"# Innovation Sprint Ledger: folder format (schema `innovation-sprint-ledger/1`)\r\n\r\nOne team = one folder of plain JSON files. `sprint.html` (one self-contained page, no server) reads and writes it, and so can you. The page checks the folder every few seconds, so whatever you change shows up on the student's screen on its own.\r\n\r\n## Getting started (agents: read this first)\r\n\r\nWhen a student opens this folder and says something like \"get me started\":\r\n\r\n1. Read `ledger.json` (team, members, assignments, agenda) and `sector.json` (their Sector Exploration Pack). Ask their name if you don't know it. It goes in `author` and in the ids you create.\r\n2. Use the skills in `.claude/skills/` or `.agents/skills/` if your app hasn't loaded them already: `sprint-ledger` (\"where are we?\"), `sector-research` (Sprints 1 and 2), `opportunity-matrix` (opportunities → hypotheses → matrix → decision), `workshop-handoff` (closing the session, Workshop 2 brief).\r\n3. Say in one line where the team is (the first Workshop 1 step that isn't done, see the table below) and offer the next step. Keep it short: they're in a timed workshop.\r\n4. They see your changes on their board (`sprint.html`, opened in Chrome or Edge and connected to this folder) within a few seconds.\r\n\r\nThis is the team's working record for the **Innovation Sprint Challenge** (Spain-US Chamber of Commerce, Miami International Week). Workshop 1, *AI Opportunity Discovery Sprint*, takes the team from a sector to one chosen business hypothesis:\r\n\r\n| Step | Program | Files |\r\n|---|---|---|\r\n| Kick-off | Team Leader, how we'll work, who takes which dimension | `ledger.json → team, assignments` |\r\n| Sprint 1 · PESTEL | Each person takes one dimension. The team stars the key external factors | `findings/` with `\"sprint\": \"pestel\"`, `\"key\": true` |\r\n| Sprint 2 · How the sector works | Each person takes one dimension. The team lists possible opportunities | `findings/` with `\"sprint\": \"sector\"`, `opportunities/` |\r\n| Three hypotheses + weighted matrix | Compare, decide by consensus or a vote on the matrix criteria | `hypotheses/`, `ledger.json → matrix, selection`, `decisions/` |\r\n| Close | Decisions on record, handoff to Workshop 2 (Go to Market and Brand) | `decisions/`, `sessions/` |\r\n\r\n```\r\n<team folder>/\r\n  ledger.json                team, agenda + shared timer, assignments, matrix criteria, selection\r\n  sector.json                the team's Sector Exploration Pack, parsed (read-only for students)\r\n  findings/F-ana-01.json     one research finding per file (Sprint 1 and Sprint 2)\r\n  opportunities/O-ben-01.json  one possible opportunity per file\r\n  hypotheses/H-carla-01.json   one business hypothesis per file, with its matrix scores\r\n  decisions/D-carla-01.json    one team decision per file\r\n  sessions/2026-10-20.json   one end-of-session handoff per date\r\n  sources/                   original files (the pack .docx, screenshots)\r\n  AGENTS.md                  this file   ·   CLAUDE.md → points here\r\n  .claude/skills/, .agents/skills/   the five skills (the board writes them: ✦ Set up your AI)\r\n```\r\n\r\nStudents may each keep their own copy of the team's work and merge them (the board's **⇄ Share**), or connect the same OneDrive/Google Drive/Dropbox folder. Either way, ids carry the author's name, so work from different people never collides.\r\n\r\n## Rules for editing\r\n\r\n1. **Valid JSON only.** Two-space indent, UTF-8, a trailing newline. If a file won't parse, the board shows a warning and skips it.\r\n2. **The file name is the id, and ids carry their author.** `findings/F-ana-03.json` must contain `\"id\": \"F-ana-03\"`. The pattern is `<letter>-<author>-<nn>`: `F` findings, `O` opportunities, `H` hypotheses, `D` decisions. `<author>` is the person's first name in lowercase ASCII (`José` → `jose`), or `team` if nobody is named. `<nn>` is two digits and goes up by one **per author**: take the highest existing `F-ana-…` and add one. Sessions use the date `YYYY-MM-DD`. Never rename an existing id, because other files point to it.\r\n3. **Edit, don't rewrite.** Change only the fields you mean to change. Keep unknown fields. Set `updatedAt` to the current ISO time: when teammates merge their work, the newer edit of an item wins.\r\n4. **The team decides; AI proposes.** Don't star key factors, shortlist opportunities, score the matrix, choose a hypothesis or log a decision unless the team told you what they decided. You can *suggest*, in chat.\r\n5. **Never invent evidence.** Every source must be real and checkable: publisher, title, year, URL. If you're not sure a source exists or says this, write the claim without a source and say \"source to find\". Never invent numbers.\r\n6. **`verified` means a person opened the source.** Only set `\"verified\": true` (with `verifiedBy` and `verifiedAt`) when a named team member tells you they opened it and it says what the finding claims. You checking it yourself doesn't count. Anything you add starts with `\"verified\": false` and `\"origin\": \"ai\"`.\r\n7. **Lists are arrays of short strings,** one idea per item, with no bullets or numbering inside the strings.\r\n8. **Don't delete what the team rejected.** An opportunity they dropped stays, with `\"shortlisted\": false`. A hypothesis they dropped stays in the matrix. A rejected hypothesis can be hidden with `\"archived\": true`.\r\n\r\n## ledger.json\r\n\r\n(The `//` comments below explain the fields. Real files can't contain comments.)\r\n\r\n```json\r\n{\r\n  \"schema\": \"innovation-sprint-ledger/1\",\r\n  \"team\": {\r\n    \"name\": \"Team 3\",\r\n    \"number\": \"3\",\r\n    \"members\": [{ \"name\": \"Ana\" }, { \"name\": \"Ben\" }],   // 5 or 6 people\r\n    \"leader\": \"Ana\",                                      // the Team Leader: talks to facilitators, keeps time. Not the boss.\r\n    \"agreements\": [\"We decide by consensus; if we can't in 3 minutes, we vote with the matrix criteria.\"]\r\n  },\r\n  \"workshop\": {\r\n    \"current\": 1,\r\n    \"agenda\": [ { \"id\": \"pestel\", \"label\": \"Sprint 1 · PESTEL research\", \"minutes\": 15, \"tab\": \"pestel\" } ],   // 120 minutes in total\r\n    \"timer\": { \"blockId\": \"pestel\", \"startedAt\": \"2026-10-20T14:10:00Z\" }   // shared countdown; blockId \"\" = not started\r\n  },\r\n  \"assignments\": {\r\n    \"pestel\": { \"political\": \"Ana\", \"economic\": \"Ben\", \"social\": \"\", \"technological\": \"\", \"environmental\": \"\", \"legal\": \"\" },\r\n    \"sector\": { \"ecosystem\": \"\", \"valuechain\": \"\", \"frictions\": \"\", \"competition\": \"\", \"segments\": \"\", \"models\": \"\" }\r\n  },\r\n  \"matrix\": {\r\n    \"scale\": 5,                                  // scores are 1 (weak) to 5 (strong); 0 or missing = not scored\r\n    \"criteria\": [ { \"id\": \"evidence\", \"label\": \"Evidence the problem is real\", \"weight\": 25, \"hint\": \"…\" } ]   // weights add up to 100\r\n  },\r\n  \"selection\": {\r\n    \"hypothesisId\": \"H-carla-01\",                        // the chosen hypothesis, \"\" until the team decides\r\n    \"method\": \"consensus\",                       // consensus | vote\r\n    \"votes\": { \"Ana\": \"H-carla-01\", \"Ben\": \"H-ana-01\" },       // only if they voted\r\n    \"rationale\": \"Strongest evidence and a customer we can reach in Miami.\",\r\n    \"decidedAt\": \"2026-10-20T15:45:00Z\"\r\n  },\r\n  \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\nDefault matrix criteria (the team can rename, reweight, add or remove them): evidence the problem is real 25 · clear, reachable customer 15 · size of the opportunity 15 · why now 10 · someone will pay 20 · feasible to launch 15. Matrix score = Σ(weight × score) / (Σweight × scale) × 100.\r\n\r\n## sector.json (the Sector Exploration Pack)\r\n\r\nMade by the board (Brief tab → Load a pack .docx), by `bun kit.ts sector pack.docx`, or by the `pack-to-sector` skill. Students read it, they don't edit it. Fields: `schema: \"sector-pack/1\"`, `id`, `name`, `referenceMarket`, `intro`, `definition`, `inside[]`, `outside[]`, `players[{type, howMoney, examples}]`, `revenueModels[]`, `valueChain{note, steps[{name, actors}], enablingLabel, enabling[]}`, `keyFigures[{level, figure, source}]`, `figuresNote`, `challenge`, `pestelNote`, `sprint2Questions[{dimension, question}]`, `glossary[{term, def}]`, `sources[{group, items[]}]`, `extra[{title, blocks}]` (sections it couldn't map).\r\n\r\nThe pa
