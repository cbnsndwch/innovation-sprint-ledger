<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint Ledger</title>
<style>
:root{
  --paper:#f6f3ec; --card:#fffdf8; --ink:#1d1b17; --ink-2:#55504a; --ink-3:#8a847b;
  --line:#e2ddd2; --line-2:#cfc8ba; --accent:#1d4ed8; --accent-ink:#fff; --accent-soft:#e3eafd; --brand:#b4162c;
  --must:#d9480f; --must-soft:#fde9df; --should:#b7791f; --should-soft:#fbf1dc;
  --could:#0f7b6c; --could-soft:#dcf2ee; --wont:#6b6b6b; --wont-soft:#ececec;
  --ok:#2f855a; --ok-soft:#e1f3e8; --warn:#c05621; --bad:#c53030; --bad-soft:#fde2e2;
  --note:#fff3b0; --note-ink:#4a3f00; --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --radius:12px; --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#16150f; --card:#201f19; --ink:#f1ede4; --ink-2:#bdb6a9; --ink-3:#8c8578;
    --line:#34322a; --line-2:#48453b; --accent:#86a8ff; --accent-ink:#0b1430; --accent-soft:#1d2a4d; --brand:#ff6b7d;
    --must:#ff8a5c; --must-soft:#3a2219; --should:#f0b85a; --should-soft:#382c17;
    --could:#4fd1bd; --could-soft:#173430; --wont:#a3a3a3; --wont-soft:#2c2c2c;
    --ok:#68d391; --ok-soft:#1b3326; --warn:#f6ad55; --bad:#fc8181; --bad-soft:#3b1e1e;
    --note:#4a4220; --note-ink:#fff3c4; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
.muted{color:var(--ink-3)} .small{font-size:13px} .mono{font-family:var(--mono)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 13px var(--mono);flex:none}
.brand-name{font:600 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.brand-sub{font-size:12px;color:var(--ink-3);white-space:nowrap}
.spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--line);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-size:14px}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;color:var(--ink-2);background:var(--card);cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--ink-3)}
.icon-btn:hover{background:var(--line);color:var(--ink)}

/* layout */
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 80px}
.banner{max-width:1400px;margin:12px auto 0;padding:0 16px}
.banner-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.banner-in.warn{background:var(--should-soft);border-color:color-mix(in srgb,var(--should) 40%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:22px}
.kicker{font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* forms */
label.field{display:block;margin:0 0 12px}
label.field>span{display:block;font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
label.field>small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
input[type=text],input[type=date],input[type=url],input[type=password],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--paper);border-radius:9px;padding:8px 10px;outline:none}
textarea{min-height:64px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:6px 11px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(20,15,5,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--card);z-index:41;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-body{padding:18px;overflow:auto;flex:1}
.drawer-foot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal .card{pointer-events:auto;max-width:520px;width:100%;padding:20px;max-height:calc(100vh - 32px);overflow:auto}
.modal.wide .card{max-width:760px}
.codebox{white-space:pre-wrap;background:var(--paper);padding:10px;border-radius:8px;border:1px solid var(--line)}
.modal h3{font-size:20px;margin-bottom:8px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}

/* toast */
.toasts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:480px}
.toast{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(8,8,6,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img,.lightbox video{max-width:100%;max-height:calc(100vh - 90px);border-radius:8px}
.lightbox .lb-cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#eee;font-size:14px;padding:0 60px}
.lightbox .lb-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;font-size:28px;width:48px;height:64px;border-radius:10px;cursor:pointer}
.lightbox .lb-prev{left:10px} .lightbox .lb-next{right:10px}
.lightbox .lb-close{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:10px;cursor:pointer}

.empty{border:2px dashed var(--line-2);border-radius:var(--radius);padding:28px;text-align:center;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--line);color:var(--ink-2);white-space:nowrap}
.prio-must{--p:var(--must);--ps:var(--must-soft)} .prio-should{--p:var(--should);--ps:var(--should-soft)}
.prio-could{--p:var(--could);--ps:var(--could-soft)} .prio-wont{--p:var(--wont);--ps:var(--wont-soft)}
.prio-tag{font:700 10px/1 var(--sans);letter-spacing:.08em;padding:4px 7px;border-radius:5px;background:var(--ps);color:var(--p);text-transform:uppercase}
@media (max-width:640px){
  .brand-sub{display:none}
  .wrap{padding:12px 12px 90px}
  .section-title h2{font-size:19px}
}

/* strip: gates · clock · evidence */
.strip{display:grid;grid-template-columns:minmax(260px,1.6fr) minmax(260px,1.2fr) minmax(200px,.8fr);gap:12px;align-items:stretch;margin-bottom:16px}
.strip .card{padding:14px 16px}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin:8px 0 6px}
.meter>i{display:block;height:100%}
.big-num{font:600 26px/1 var(--serif)}
.next-task{font:500 16px/1.35 var(--serif)}
.gates{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:10px}
.gate{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 9px 3px 4px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.gate:hover{border-color:var(--line-2)}
.gdot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:10px;flex:none}
.gate.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.gate.ok .gdot{background:var(--ok);border-color:var(--ok);color:#fff}
.timer .clock{font:600 34px/1 var(--mono);letter-spacing:-.02em;min-width:104px}
.clock.soon{color:var(--should)} .clock.over{color:var(--bad)}
.ev-mini{cursor:pointer}
@media (max-width:1000px){.strip{grid-template-columns:1fr}}

/* canvas */
.canvas{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.canvas>.card{padding:16px 18px;position:relative;min-width:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
@media (max-width:1000px){.c8,.c6,.c4{grid-column:span 12}}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-head .kicker{flex:1}
.edit-btn{opacity:.55}
.card:hover .edit-btn,.edit-btn:focus{opacity:1}
.prose{white-space:pre-wrap;margin:0}
.placeholder{color:var(--ink-3);font-style:italic;cursor:pointer}
.hero-name{font-size:30px;line-height:1.15;margin:2px 0 8px}
.hero-sum{font:400 17px/1.5 var(--serif);color:var(--ink-2);margin:0;white-space:pre-wrap}
.lead{font:400 17px/1.5 var(--serif);margin:4px 0 12px}
.ul{margin:0;padding-left:18px} .ul li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.primary{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.chip.member{border:0;cursor:pointer;font-size:14px;padding:5px 12px}
.chip.ghosty{border:1px dashed var(--line-2);background:transparent;cursor:pointer}
.welcome{padding:22px!important;background:linear-gradient(135deg,var(--accent-soft),var(--card))!important}
.welcome ol{margin:10px 0 0;padding-left:20px}.welcome li{margin:6px 0}
.sector-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.board-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.board-bar>div:first-child{max-width:720px}
.empty{margin-top:8px}

/* brief */
.brief-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 9%,var(--card)),var(--card))!important}
.challenge{background:var(--ink)!important;color:var(--paper);border-color:var(--ink)!important}
.challenge .kicker{color:color-mix(in srgb,var(--paper) 60%,transparent)}
.challenge p{font:500 18px/1.5 var(--serif);margin:8px 0 0;max-width:980px}
.inout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.inout h4{margin:0 0 6px;font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.inout h4.in{color:var(--ok)} .inout h4.out{color:var(--bad)}
@media (max-width:700px){.inout{grid-template-columns:1fr}}
.flow{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.step{flex:1 1 0;min-width:150px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.step .n{font:700 12px var(--mono);color:var(--accent);display:block;margin-bottom:4px}
.arrow{flex:none;width:22px;display:grid;place-items:center;color:var(--ink-3)}
.enabling{margin-top:10px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fig p{margin:6px 0 4px;font:500 15px/1.4 var(--serif)}
.mini-h{margin:12px 0 4px;font:600 13px var(--sans)}
.gloss{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:13px}
.gloss dt{font-weight:700} .gloss dd{margin:0;color:var(--ink-2)}

/* team */
.leader{background:var(--should-soft)!important;border-color:transparent!important}
.asg td:first-child{width:50%}
.agenda tr.now td{background:var(--accent-soft)}
.agenda input{padding:5px 8px}
.contrib td{vertical-align:middle}
.bar{position:relative;height:18px;background:var(--line);border-radius:5px;min-width:80px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.35}
.bar span{position:relative;padding-left:6px;font:600 12px/18px var(--mono)}

/* research boards */
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.dims{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.dims{grid-template-columns:1fr}}
.dim{padding:12px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--line) 35%,var(--card))}
.dim.mine{outline:2px solid var(--accent);outline-offset:-1px}
.dim-head{display:flex;align-items:center;gap:6px}
.dim-head h3{font-size:17px}
.dim-head .count{font:600 12px var(--mono);color:var(--ink-3)}
.dim-q{margin:0;font-size:13px;color:var(--ink-2);line-height:1.4}
.dim-actions{display:flex;gap:6px;flex-wrap:wrap}
.findings{display:flex;flex-direction:column;gap:7px}
.finding{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:9px;padding:8px 10px;cursor:pointer;box-shadow:var(--shadow)}
.finding.key{border-left-color:var(--should);background:color-mix(in srgb,var(--should-soft) 55%,var(--card))}
.finding:hover{border-color:var(--line-2)}
.f-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.f-title{margin:0;font-size:14px;line-height:1.35;font-weight:500}
.f-by{font-size:11px;color:var(--ink-3);margin-top:4px}
.story-id{font:600 12px var(--mono);color:var(--ink-3)}
.badge{font-size:11px;padding:2px 6px;border-radius:5px;background:var(--line);color:var(--ink-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.warn{background:var(--should-soft);color:var(--should)}
.star{border:0;background:transparent;cursor:pointer;font-size:18px;line-height:1;color:var(--ink-3);padding:0 2px}
.star.on{color:var(--should)}

/* opportunities */
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.opp{padding:14px 16px;cursor:pointer}
.opp.short{outline:2px solid var(--ok);outline-offset:-1px}
.opp h3{font-size:18px;margin:2px 0 6px}
.opp-f{margin:0 0 8px;font:500 15px/1.4 var(--serif)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:13px}
.kv dt{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.kv dd{margin:0}

/* hypotheses + matrix */
.hyps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px}
.hyp{padding:14px 16px;cursor:pointer}
.hyp.chosen{outline:3px solid var(--brand);outline-offset:-1px}
.hyp h3{font-size:19px;margin:4px 0 10px}
.score{font:600 22px/1 var(--serif)} .score small{font-size:12px;color:var(--ink-3);margin-left:1px}
.matrix-card{padding:16px 18px}
.matrix td{vertical-align:middle}
.matrix td:first-child{min-width:220px}
.matrix input[type=text]{border-color:transparent;background:transparent;padding:4px 6px;font-weight:600}
.matrix input[type=text]:hover{border-color:var(--line-2)}
.matrix input[type=number]{width:58px;padding:4px 6px}
.matrix tfoot td{border-top:1px solid var(--line-2);font-weight:600}
.matrix .total{font:600 20px var(--serif)} .matrix .total small{font-size:12px;color:var(--ink-3)}
.matrix .total.top{color:var(--brand)}
.ok-t{color:var(--ok)} .warn-t{color:var(--warn)}
.sc{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.sc button{border:0;background:var(--card);width:30px;height:28px;cursor:pointer;font-size:13px;border-right:1px solid var(--line);color:var(--ink-2)}
.sc button:last-child{border-right:0}
.sc button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.votes{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.vote{display:flex;align-items:center;gap:8px;font-size:13px}
.vote span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vote select{width:auto;padding:4px 6px}
.chosen-panel{padding:18px 20px;margin-bottom:14px;border:2px solid var(--brand)!important;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 7%,var(--card)),var(--card))!important}
.chosen-title{font-size:26px;margin:0 0 12px}
.chosen-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
.chosen-grid .cf p{margin:4px 0 0;white-space:pre-wrap}
.chosen-grid .cf.big p{font:500 17px/1.4 var(--serif)}
@media (max-width:900px){.chosen-grid{grid-template-columns:1fr}}

/* evidence */
.evtbl tr.ok-row td{background:color-mix(in srgb,var(--ok-soft) 50%,transparent)}
.evtbl td:first-child{max-width:520px}
.banner-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--radius)}

/* handoff */
.callout{background:var(--ink)!important;color:var(--paper);border-color:var(--ink)!important}
.callout .kicker{color:color-mix(in srgb,var(--paper) 60%,transparent)}
.callout .next-task{font-size:20px;margin-top:6px}

<body>
<div id="app"></div>
<noscript>This page needs JavaScript.</noscript>
<script>
/* Sector Exploration Pack (.docx) → sector.json
 * Runs in the browser (sprint.html) and in Bun (kit.ts sector). No dependencies:
 * a tiny zip reader + DecompressionStream('deflate-raw') + regex over word/document.xml.
 * All 8 packs share one layout: a title block, then numbered sections
 * (definition, players, value chain, key figures, challenge, guiding questions,
 * glossary, sources). Sections are matched by keywords in their heading, not by
 * number, and every section also keeps its raw paragraphs and tables, so a pack
 * that drifts from the layout still shows up readable on the Brief tab.
 */
const SectorPack = (() => {
  'use strict';
  const SECTOR_SCHEMA = 'sector-pack/1';

  // ---------- zip ----------
  async function unzipEntry(buf, name) {
    const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('Not a .docx file (no zip directory found)');
    let p = dv.getUint32(eocd + 16, true);
    const n = dv.getUint16(eocd + 10, true), dec = new TextDecoder();
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true), fname = dec.decode(u8.subarray(p + 46, p + 46 + nl));
      if (fname === name) {
        const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
        const data = u8.subarray(start, start + csize);
        if (method === 0) return dec.decode(data);
        if (method !== 8) throw new Error('Unsupported compression in .docx');
        const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return await new Response(stream).text();
      }
      p += 46 + nl + xl + cl;
    }
    throw new Error(name + ' not found in the file');
  }

  // ---------- docx → blocks ----------
  const ent = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  const clean = (s) => ent(s).replace(/\s+/g, ' ').trim();
  const runText = (xml) => clean((xml.match(/<w:t(?:\s[^>]*)?>[^<]*<\/w:t>|<w:tab\/>|<w:br\/>/g) || []).map(t => t.startsWith('<w:t') ? t.replace(/<[^>]+>/g, '') : ' ').join(''));

  function blocks(xml) {
    const body = (/<w:body>([\s\S]*)<\/w:body>/.exec(xml) || [, xml])[1];
    const out = [];
    const re = /<w:tbl>[\s\S]*?<\/w:tbl>|<w:p[ >][\s\S]*?<\/w:p>/g;
    let m;
    while ((m = re.exec(body))) {
      const s = m[0];
      if (s.startsWith('<w:tbl>')) {
        const rows = (s.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g) || []).map(r => (r.match(/<w:tc>[\s\S]*?<\/w:tc>/g) || []).map(c => runText(c)));
        out.push({ t: 'table', rows: rows.filter(r => r.some(Boolean)) });
      } else {
        const text = runText(s);
        if (text) out.push({ t: 'p', text, style: (/<w:pStyle w:val="([^"]+)"/.exec(s) || [])[1] || '' });
      }
    }
    return out;
  }

  // ---------- blocks → sector ----------
  const SECTION_KEYS = [
    ['definition', /definition|boundar/i], ['players', /who is in|make money|players|actors/i], ['valueChain', /value chain|journey/i],
    ['keyFigures', /key figures|figures|data/i], ['challenge', /challenge/i], ['questions', /guiding|questions/i],
    ['glossary', /glossary/i], ['sources', /sources/i]
  ];
  const splitDots = (s) => String(s || '').split(/\s*[·•]\s*/).map(x => x.trim().replace(/\.$/, '')).filter(Boolean);
  const slug = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/&/g, ' ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const isHeading = (b) => b.t === 'p' && /^\d{1,2}\.\s+\S/.test(b.text) && b.text.length < 90 && b.text === b.text.toUpperCase();

  function parseBlocks(bl) {
    const sector = { schema: SECTOR_SCHEMA, id: '', name: '', label: '', referenceMarket: '', intro: '', definition: '', inside: [], outside: [], players: [], playersNote: '', revenueModels: [],
      valueChain: { note: '', steps: [], enabling: [] }, keyFigures: [], figuresNote: '', challenge: '', pestelNote: '', sprint2Questions: [], glossary: [], sources: [], sections: [], extra: [] };
    let i = 0;
    const head = [];
    while (i < bl.length && !isHeading(bl[i])) head.push(bl[i++]);
    const hp = head.filter(b => b.t === 'p').map(b => b.text);
    sector.label = hp.find(t => /exploration pack|workshop/i.test(t)) || '';
    sector.name = hp.find(t => t !== sector.label && t.length < 80 && t === t.toUpperCase()) || hp.find(t => t !== sector.label) || 'Sector';
    const introP = hp.filter(t => t !== sector.label && t !== sector.name).join(' ');
    const rm = /Reference market:\s*([^.]*(?:\([^)]*\))?[^.]*)\./i.exec(introP);
    if (rm) sector.referenceMarket = rm[1].trim();
    sector.intro = introP.replace(/^.*?Reference market:[^.]*(?:\([^)]*\))?[^.]*\.\s*/i, '').trim() || introP;
    sector.name = titleCase(sector.name);
    sector.id = slug(sector.name);

    while (i < bl.length) {
      const heading = bl[i++].text;
      const items = [];
      while (i < bl.length && !isHeading(bl[i])) items.push(bl[i++]);
      const key = (SECTION_KEYS.find(([, re]) => re.test(heading.replace(/^\d+\.\s*/, ''))) || [])[0] || '';
      const title = titleCase(heading.replace(/^\d+\.\s*/, ''));
      sector.sections.push({ key, title });
      if (!key) sector.extra.push({ title, blocks: items });
      const ps = items.filter(b => b.t === 'p').map(b => b.text), tables = items.filter(b => b.t === 'table');
      try {
        if (key === 'definition') {
          sector.definition = ps[0] || '';
          for (const r of (tables[0] || {}).rows || []) {
            if (/^inside/i.test(r[0])) sector.inside = splitDots(r.slice(1).join(' '));
            if (/^outside/i.test(r[0])) sector.outside = [r.slice(1).join(' ')];
          }
          if (sector.outside.length === 1) {
            const s = sector.outside[0], cut = s.search(/\.\s+[A-Z]/);
            const list = cut > 0 ? s.slice(0, cut) : s;
            sector.outside = splitDots(list); if (cut > 0) sector.outsideNote = s.slice(cut + 1).trim();
          }
        } else if (key === 'players') {
          const t = tables[0];
          if (t) sector.players = t.rows.slice(1).map(r => ({ type: r[0] || '', howMoney: r[1] || '', examples: r[2] || '' }));
          sector.playersNote = ps.find(p => !/^revenue models/i.test(p)) || '';
          const rv = ps.find(p => /^revenue models/i.test(p));
          if (rv) sector.revenueModels = splitDots(rv.replace(/^[^:]*:\s*/, ''));
        } else if (key === 'valueChain') {
          sector.valueChain.note = ps.join(' ');
          const t = tables[0];
          if (t && t.rows.length) {
            const [names, actors = []] = t.rows;
            sector.valueChain.steps = names.map((n, k) => ({ name: n.replace(/^\d+\.\s*/, ''), actors: actors[k] || '' }));
            const en = t.rows.slice(2).map(r => r.filter(Boolean).join(' ')).join(' ');
            if (en) { sector.valueChain.enablingLabel = (/^([^:]+):/.exec(en) || [, 'Enabling layer'])[1]; sector.valueChain.enabling = splitDots(en.replace(/^[^:]*:\s*/, '')); }
          }
        } else if (key === 'keyFigures') {
          const t = tables[0];
          if (t) sector.keyFigures = t.rows.slice(1).map(r => ({ level: r[0] || '', figure: r[1] || '', source: r[2] || '' }));
          sector.figuresNote = ps.join(' ');
        } else if (key === 'challenge') {
          sector.challenge = ps.join('\n\n');
        } else if (key === 'questions') {
          sector.pestelNote = ps.join(' ');
          const t = tables[0];
          if (t) sector.sprint2Questions = t.rows.slice(1).map(r => ({ dimension: r[0] || '', question: r[1] || '' }));
        } else if (key === 'glossary') {
          for (const t of tables) for (const r of t.rows) for (let k = 0; k + 1 < r.length; k += 2) if (r[k]) sector.glossary.push({ term: r[k], def: r[k + 1] || '' });
        } else if (key === 'sources') {
          const all = ps.join(' ');
          const parts = all.split(/\s*(?=\b[A-Z][A-Za-z ]{2,30}:\s)/).filter(Boolean);
          for (const part of parts) {
            const mm = /^([^:]{2,32}):\s*(.*)$/.exec(part);
            sector.sources.push(mm ? { group: mm[1].trim(), items: splitDots(mm[2]) } : { group: 'Sources', items: splitDots(part) });
          }
        }
      } catch (e) { /* keep the raw section; the Brief tab falls back to it */ }
    }
    return sector;
  }
  function titleCase(s) {
    if (s !== s.toUpperCase()) return s;
    const small = new Set(['and', 'of', 'the', 'in', 'for', 'to', 'a', 'an', 'or', 'on', 'by']);
    return s.toLowerCase().replace(/\b[\w']+/g, (w, o) => (o && small.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).replace(/\bU\.s\./g, 'U.S.');
  }

  async function fromDocx(buf) {
    const xml = await unzipEntry(buf, 'word/document.xml');
    return parseBlocks(blocks(xml));
  }

  /** Light check used before writing sector.json: returns a list of problems (empty = fine). */
  function check(s) {
    const out = [];
    if (!s || typeof s !== 'object') return ['not an object'];
    if (!s.name) out.push('no sector name');
    if (!s.challenge) out.push('no Exploration Challenge found');
    if (!s.definition) out.push('no sector definition found');
    if (!(s.keyFigures || []).length) out.push('no key figures table found');
    if (!(s.sprint2Questions || []).length) out.push('no Sprint 2 guiding questions found');
    return out;
  }

  const api = { SECTOR_SCHEMA, fromDocx, parseBlocks, blocks, check, slug };
  if (typeof globalThis !== 'undefined') globalThis.SectorPack = api;
  return api;
})();

/* Innovation Sprint Ledger: storage + sync layer. One self-contained page, no server, nothing to install.
 * One team = one folder of JSON files (see AGENTS.md). Two ways to keep it:
 *   folder : File System Access API (Chrome / Edge). Agents read and write the same files; the page polls them.
 *            Put the folder in OneDrive / Google Drive / Dropbox and teammates who connect it see each other's work.
 *   browser: localStorage, when no folder is connected (or in Safari / Firefox).
 * Teammates without a shared folder pass their work around as a file or pasted text (Share my work → Add a
 * teammate's work). Ids carry the author's name (F-ana-01), so merged work never collides.
 */
const LL = (() => {
  'use strict';
  const SCHEMA = 'innovation-sprint-ledger/1';
  const APP = 'innovation-sprint-ledger';
  const POLL_MS = 2500;

  // ---------- tiny utils ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else if (k in el && typeof v !== 'string') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat(Infinity)) {
      if (k == null || k === false) continue;
      el.append(k instanceof Node ? k : document.createTextNode(String(k)));
    }
    return el;
  }
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const nowIso = () => new Date().toISOString();
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
  const lsDel = (k) => { try { localStorage.removeItem(k); } catch {} };
  const fmtDate = (s) => { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T12:00:00' : s); return isNaN(d) ? s : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); };
  const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); if (s < 5) return 'just now'; if (s < 60) return s + 's ago'; const m = Math.round(s / 60); if (m < 60) return m + 'm ago'; return Math.round(m / 60) + 'h ago'; };
  const lines = (s) => String(s || '').split('\n').map(x => x.replace(/^\s*[-*•]\s*/, '').trim()).filter(Boolean);
  const clone = (o) => o == null ? o : JSON.parse(JSON.stringify(o));
  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);

  function toast(msg, ms = 2600) {
    let box = $('.toasts'); if (!box) { box = h('div', { class: 'toasts' }); document.body.append(box); }
    const t = h('div', { class: 'toast' }, msg); box.append(t); setTimeout(() => t.remove(), ms);
  }
  function modal({ title, body, actions, wide }) {
    return new Promise((resolve) => {
      const scrim = h('div', { class: 'scrim open' });
      const close = (v) => { scrim.remove(); m.remove(); document.removeEventListener('keydown', key); resolve(v); };
      const key = (e) => { if (e.key === 'Escape') close(null); };
      const m = h('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog' }, h('div', { class: 'card' },
        h('h3', null, title), typeof body === 'string' ? h('p', { class: 'muted' }, body) : body,
        h('div', { class: 'actions' }, actions.map(a => h('button', { class: 'btn ' + (a.cls || ''), onclick: () => close(typeof a.value === 'function' ? a.value() : a.value) }, a.label)))));
      scrim.addEventListener('click', () => close(null));
      document.addEventListener('keydown', key);
      document.body.append(scrim, m);
      const first = m.querySelector('textarea, input'); if (first) setTimeout(() => first.focus(), 30);
    });
  }
  async function copyText(text, what = 'Copied') {
    try { await navigator.clipboard.writeText(text); toast(what + ' to clipboard'); }
    catch {
      const ta = h('textarea', { style: { position: 'fixed', opacity: 0 } }); ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand('copy'); toast(what + ' to clipboard'); } catch { toast('Copy failed. Select and copy manually.'); } ta.remove();
    }
  }
  function download(name, text, type = 'application/json') {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
    document.body.append(a); a.click(); a.remove();
  }

  // ---------- who is using this laptop ----------
  // Stored per browser, never in the ledger: it only decides whose name goes on new findings.
  const me = () => lsGet('isl:me', '');
  /** "Ana María" → "ana", "José" → "jose". Used in ids, so teammates never collide. */
  const personSlug = (name) => (String(name || '').trim().split(/\s+/)[0] || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '').slice(0, 12) || 'team';
  const setMe = (name) => lsSet('isl:me', name || '');

  // ---------- IndexedDB (folder handle + browser-mode files) ----------
  let _db;
  function idb() {
    if (_db) return _db;
    _db = new Promise((res, rej) => {
      const r = indexedDB.open(APP, 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('blobs'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return _db;
  }
  async function idbDo(store, mode, fn) {
    const db = await idb();
    return new Promise((res, rej) => { const tx = db.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); });
  }
  const idbGet = (s, k) => idbDo(s, 'readonly', st => st.get(k)).catch(() => null);
  const idbPut = (s, k, v) => idbDo(s, 'readwrite', st => st.put(v, k));
  const idbDel = (s, k) => idbDo(s, 'readwrite', st => st.delete(k));
  const idbKeys = (s) => idbDo(s, 'readonly', st => st.getAllKeys()).catch(() => []);

  // ---------- stores ----------
  const split = (p) => p.split('/').filter(Boolean);
  const isJson = (p) => /\.json$/i.test(p);
  const ROOT_FILES = ['ledger.json', 'sector.json'];
  const VALID_NAME = /^[A-Za-z0-9_-]+\.json$/;
  const MANIFEST_DIRS = ['findings', 'opportunities', 'hypotheses', 'decisions', 'sessions'];
  class Exists extends Error { constructor() { super('exists'); this.exists = true; } }

  class FsStore {
    constructor(handle) { this.kind = 'folder'; this.handle = handle; this.label = handle.name; this.urls = new Map(); }
    async permission(ask) {
      const opts = { mode: 'readwrite' };
      if ((await this.handle.queryPermission(opts)) === 'granted') return true;
      if (!ask) return false;
      return (await this.handle.requestPermission(opts)) === 'granted';
    }
    async _dir(parts, create) {
      let d = this.handle;
      for (const p of parts) d = await d.getDirectoryHandle(p, { create });
      return d;
    }
    async _file(path, create) {
      const parts = split(path); const name = parts.pop();
      const d = await this._dir(parts, create);
      return d.getFileHandle(name, { create });
    }
    async read(path) { try { return await (await (await this._file(path)).getFile()).text(); } catch { return null; } }
    async readBlob(path) { try { return await (await this._file(path)).getFile(); } catch { return null; } }
    async write(path, data, opts = {}) {
      if (opts.create && (await this.read(path)) != null) throw new Exists();
      const fh = await this._file(path, true);
      const w = await fh.createWritable(); await w.write(data); await w.close();
      this.urls.delete(path);
    }
    async remove(path) {
      const parts = split(path); const name = parts.pop();
      try { await (await this._dir(parts)).removeEntry(name); } catch {}
      this.urls.delete(path);
    }
    async list(dir) {
      const out = [];
      try { const d = await this._dir(split(dir)); for await (const [name, hd] of d.entries()) if (!name.startsWith('.')) out.push({ name, kind: hd.kind }); } catch {}
      return out.sort((a, b) => a.name.localeCompare(b.name));
    }
    async manifest() {
      const files = {};
      for (const f of ROOT_FILES) try { files[f] = (await (await this.handle.getFileHandle(f)).getFile()).lastModified; } catch {}
      for (const dn of MANIFEST_DIRS) {
        let d; try { d = await this.handle.getDirectoryHandle(dn); } catch { continue; }
        for await (const [name, hd] of d.entries()) {
          // Cloud-sync conflict copies ("F-ana-01 (1).json") aren't valid ids: skip them.
          if (hd.kind !== 'file' || !VALID_NAME.test(name)) continue;
          try { files[dn + '/' + name] = (await hd.getFile()).lastModified; } catch {}
        }
      }
      return files;
    }
    async url(path) {
      if (this.urls.has(path)) return this.urls.get(path);
      const b = await this.readBlob(path); if (!b) return '';
      const u = URL.createObjectURL(b); this.urls.set(path, u); return u;
    }
  }

  class LocalStore {
    constructor() { this.kind = 'browser'; this.label = 'this browser'; this.urls = new Map(); }
    k(p) { return 'isl:f:' + p; }
    async read(path) { if (isJson(path)) { const v = lsGet(this.k(path)); return v ? v.t : null; } return null; }
    async readBlob(path) { return (await idbGet('blobs', path)) || null; }
    async write(path, data, opts = {}) {
      if (opts.create && (await this.read(path)) != null) throw new Exists();
      if (typeof data === 'string') { if (!lsSet(this.k(path), { t: data, m: Date.now() })) throw new Error('Browser storage is full. Connect a folder.'); }
      else { await idbPut('blobs', path, data); this.urls.delete(path); }
    }
    async remove(path) { lsDel(this.k(path)); await idbDel('blobs', path).catch(() => {}); this.urls.delete(path); }
    _jsonKeys() { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('isl:f:')) out.push(k.slice(6)); } } catch {} return out; }
    async list(dir) {
      const pre = dir.replace(/\/?$/, '/'); const names = new Set();
      for (const p of [...this._jsonKeys(), ...(await idbKeys('blobs'))]) if (p.startsWith(pre)) { const rest = p.slice(pre.length); names.add(rest.split('/')[0] + (rest.includes('/') ? '/' : '')); }
      return [...names].sort().map(n => n.endsWith('/') ? { name: n.slice(0, -1), kind: 'directory' } : { name: n, kind: 'file' });
    }
    async manifest() { const files = {}; for (const p of this._jsonKeys()) { const v = lsGet(this.k(p)); if (v) files[p] = v.m; } return files; }
    async url(path) {
      if (this.urls.has(path)) return this.urls.get(path);
      const b = await this.readBlob(path); if (!b) return '';
      const u = URL.createObjectURL(b); this.urls.set(path, u); return u;
    }
    hasData() { return this._jsonKeys().length > 0; }
  }

  // ---------- the ledger file ----------
  // Workshop 1 agenda: 120 minutes. Facilitators can change it on the Team tab (or in ledger.json).
  const DEFAULT_AGENDA = [
    { id: 'kickoff', label: 'Kick-off: pack, intros, Team Leader', minutes: 10, tab: 'team' },
    { id: 'pestel', label: 'Sprint 1 · PESTEL research (each person one dimension)', minutes: 15, tab: 'pestel' },
    { id: 'pestel-share', label: 'Sprint 1 · Share and pick the key factors', minutes: 10, tab: 'pestel' },
    { id: 'sector', label: 'Sprint 2 · How the sector works (each person one dimension)', minutes: 20, tab: 'sector' },
    { id: 'sector-share', label: 'Sprint 2 · Share and list opportunities', minutes: 15, tab: 'opportunities' },
    { id: 'hypotheses', label: 'Write three business hypotheses', minutes: 15, tab: 'hypotheses' },
    { id: 'matrix', label: 'Weighted decision matrix + decide', minutes: 15, tab: 'hypotheses' },
    { id: 'define', label: 'Define the chosen idea + launch market', minutes: 15, tab: 'hypotheses' },
    { id: 'close', label: 'Close: decisions + handoff to Workshop 2', minutes: 5, tab: 'handoff' }
  ];
  // Criteria the team weighs hypotheses on. Built from what the jury evaluates (program brief, "Resumen del reto").
  const DEFAULT_CRITERIA = [
    { id: 'evidence', label: 'Evidence the problem is real', weight: 25, hint: 'Data, sources, reviews, reports. Not opinions.' },
    { id: 'customer', label: 'Clear, reachable customer', weight: 15, hint: 'Can you name them and find 10 of them next week?' },
    { id: 'size', label: 'Size of the opportunity', weight: 15, hint: 'How many have the problem, how often, how much it costs them.' },
    { id: 'now', label: 'Why now', weight: 10, hint: 'A PESTEL factor that makes this more urgent today than 3 years ago.' },
    { id: 'pay', label: 'Someone will pay', weight: 20, hint: 'Who pays, how much, through which revenue model.' },
    { id: 'feasible', label: 'Feasible to launch', weight: 15, hint: 'Could a seed-stage team launch it in the chosen market?' }
  ];
  const blankLedger = () => ({
    schema: SCHEMA,
    team: { name: '', number: '', members: [], leader: '', agreements: [] },
    workshop: { current: 1, agenda: clone(DEFAULT_AGENDA), timer: { blockId: '', startedAt: null } },
    assignments: { pestel: {}, sector: {} },
    matrix: { criteria: clone(DEFAULT_CRITERIA), scale: 5 },
    selection: { hypothesisId: '', method: '', votes: {}, rationale: '', decidedAt: null },
    updatedAt: nowIso()
  });

  // Fills in missing defaults IN PLACE, so cards that hold a reference to the ledger (or to ledger.team…)
  // keep editing the live object after a save.
  function normalizeLedger(l) {
    const b = blankLedger(); l = isObj(l) ? l : {};
    const fill = (o, d) => { for (const k of Object.keys(d)) if (!(k in o)) o[k] = d[k]; return o; };
    const sub = (k) => (l[k] = fill(isObj(l[k]) ? l[k] : {}, b[k]));
    fill(l, b);
    const t = sub('team');
    if (!Array.isArray(t.members)) t.members = [];
    if (t.members.some(m => !isObj(m) || !m.name)) t.members = t.members.map(m => typeof m === 'string' ? { name: m } : m).filter(m => isObj(m) && m.name);
    if (!Array.isArray(t.agreements)) t.agreements = t.agreements ? [t.agreements] : [];
    const w = sub('workshop');
    if (!Array.isArray(w.agenda) || !w.agenda.length) w.agenda = clone(DEFAULT_AGENDA);
    w.timer = fill(isObj(w.timer) ? w.timer : {}, b.workshop.timer);
    const a = sub('assignments');
    for (const k of ['pestel', 'sector']) if (!isObj(a[k])) a[k] = {};
    const m = sub('matrix');
    if (!Array.isArray(m.criteria) || !m.criteria.length) m.criteria = clone(DEFAULT_CRITERIA);
    const s = sub('selection');
    if (!isObj(s.votes)) s.votes = {};
    return l;
  }

  // ---------- merging ----------
  // Three-way merge: take every field I changed since I last read the file, keep everything else from disk.
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  function merge3(base, mine, disk) {
    if (!isObj(base) || !isObj(mine) || !isObj(disk)) return same(mine, base) ? disk : mine;
    const out = Object.assign({}, disk);
    for (const k of new Set([...Object.keys(mine), ...Object.keys(base)])) {
      if (same(mine[k], base[k])) continue;
      if (!(k in mine)) { delete out[k]; continue; }
      out[k] = isObj(mine[k]) && isObj(base[k]) && isObj(disk[k]) ? merge3(base[k], mine[k], disk[k]) : mine[k];
    }
    return out;
  }

  function assignDeep(target, src) {
    for (const k of Object.keys(target)) if (!(k in src) && k !== '_file') delete target[k];
    for (const [k, v] of Object.entries(src)) target[k] = isObj(v) && isObj(target[k]) ? assignDeep(target[k], v) : v;
    return target;
  }

  const SLOTS = ['findings', 'opportunities', 'hypotheses', 'decisions', 'sessions'];
  const Ledger = {
    store: null, ready: false,
    state: { ledger: normalizeLedger(null), sector: null, findings: {}, opportunities: {}, hypotheses: {}, decisions: {}, sessions: {} },
    known: {}, lastWritten: {}, base: {}, subs: [], pollTimer: null, lastSync: 0, writeChain: Promise.resolve(), pending: 0,

    on(fn) { this.subs.push(fn); },
    emit(type, detail) { for (const f of this.subs) try { f(type, detail); } catch (e) { console.error(e); } },

    pathToSlot(path) {
      if (path === 'ledger.json') return ['ledger', null];
      if (path === 'sector.json') return ['sector', null];
      const m = /^(findings|opportunities|hypotheses|decisions|sessions)\/([^/]+)\.json$/.exec(path);
      return m ? [m[1], m[2]] : [null, null];
    },
    apply(path, text) {
      const [slot, key] = this.pathToSlot(path); if (!slot) return;
      if (text == null) { if (key) delete this.state[slot][key]; else if (slot === 'sector') this.state.sector = null; delete this.base[path]; return; }
      let obj; try { obj = JSON.parse(text); } catch { console.warn('Bad JSON in', path); this.emit('badjson', path); return; }
      this.base[path] = clone(obj);
      if (slot === 'sector' || isObj(obj)) { if (key && !obj.id) obj.id = key; this._set(path, obj); }
    },
    blankState() { const s = { ledger: normalizeLedger(null), sector: null }; for (const k of SLOTS) s[k] = {}; return s; },
    async open(store) {
      clearInterval(this.pollTimer);
      this.store = store; this.ready = false;
      this.state = this.blankState();
      this.known = {}; this.lastWritten = {}; this.base = {};
      await this.reload();
      this.ready = true;
      this.emit('load');
      this.pollTimer = setInterval(() => this.poll(), POLL_MS);
    },
    async reload() {
      const man = await this.store.manifest();
      await Promise.all(Object.keys(man).map(async (p) => { this.apply(p, await this.store.read(p)); }));
      this.known = man; this.lastSync = Date.now();
      this.cacheSnapshot();
    },
    async poll() {
      if (!this.store || this.pending || document.hidden) return;
      let man; try { man = await this.store.manifest(); } catch (e) { this.emit('offline', e); return; }
      const changed = [];
      for (const [p, m] of Object.entries(man)) {
        if (this.known[p] === m) continue;
        const text = await this.store.read(p);
        if (text != null && text === this.lastWritten[p]) continue;
        this.apply(p, text); changed.push(p);
      }
      for (const p of Object.keys(this.known)) if (!(p in man)) { this.apply(p, null); changed.push(p); }
      this.known = man; this.lastSync = Date.now();
      if (changed.length) { this.cacheSnapshot(); this.emit('external', changed); }
      this.emit('synced');
    },
    cacheSnapshot() {
      if (!this.store || this.store.kind === 'browser') return;
      const files = {};
      files['ledger.json'] = JSON.stringify(this.state.ledger);
      if (this.state.sector) files['sector.json'] = JSON.stringify(this.state.sector);
      for (const slot of SLOTS) for (const [k, v] of Object.entries(this.state[slot])) { const c = Object.assign({}, v); delete c._file; files[slot + '/' + k + '.json'] = JSON.stringify(c); }
      lsSet('isl:cache', { label: this.store.label, at: Date.now(), files });
    },
    loadCache() {
      const c = lsGet('isl:cache'); if (!c) return null;
      for (const [p, t] of Object.entries(c.files || {})) this.apply(p, t);
      return c;
    },
    serialize(obj) { const c = Object.assign({}, obj); delete c._file; return JSON.stringify(c, null, 2) + '\n'; },
    queue(fn) {
      this.pending++;
      const run = this.writeChain.then(fn).catch(e => { console.error(e); toast('Could not save: ' + (e.message || e)); }).finally(() => { this.pending--; });
      this.writeChain = run; return run;
    },
    // Updates the object already in state IN PLACE (open drawers and cards hold references to it),
    // or stores obj if there's nothing there yet.
    _set(path, obj) {
      const [slot, key] = this.pathToSlot(path);
      if (slot === 'sector') { this.state.sector = obj; return; }
      if (!slot) return;
      const cur = slot === 'ledger' ? this.state.ledger : this.state[slot][key];
      const live = cur && cur !== obj && isObj(cur) ? assignDeep(cur, obj) : obj;
      if (slot === 'ledger') this.state.ledger = normalizeLedger(live);
      else { live.id = key; live._file = path; this.state[slot][key] = live; }
    },
    save(path, obj) {
      const [slot, key] = this.pathToSlot(path);
      obj.updatedAt = nowIso();
      if (slot === 'ledger') obj.schema = obj.schema || SCHEMA;
      if (key) obj.id = key;
      this._set(path, obj);
      const mine = JSON.parse(this.serialize(obj));
      this.emit('local', path);
      return this.queue(async () => {
        let out = mine;
        const base = this.base[path];
        if (base) {
          const diskText = await this.store.read(path);
          if (diskText != null && diskText !== this.lastWritten[path]) {
            try {
              const disk = JSON.parse(diskText);
              if (!same(disk, base)) { out = merge3(base, mine, disk); out.updatedAt = nowIso(); this._set(path, clone(out)); this.emit('merged', path); }
            } catch {}
          }
        }
        const text = this.serialize(out);
        this.lastWritten[path] = text; this.base[path] = clone(out);
        await this.store.write(path, text);
        this.lastSync = Date.now(); this.cacheSnapshot(); this.emit('synced');
      });
    },
    /** Create a new file with an id scoped to its author: F-ana-01, O-ben-02, H-carla-01.
     *  Teammates work in separate copies and merge later, so ids must never collide across people. Resolves to the id. */
    create(slot, prefix, obj) {
      return new Promise((resolve) => {
        this.queue(async () => {
          const who = personSlug(obj.author || obj.by || me());
          let n = this.nextNum(slot, prefix, who);
          for (let tries = 0; tries < 50; tries++, n++) {
            const id = `${prefix}-${who}-${String(n).padStart(2, '0')}`, path = `${slot}/${id}.json`;
            if (this.state[slot][id]) continue;
            const o = Object.assign({}, obj, { id, createdAt: obj.createdAt || nowIso(), updatedAt: nowIso() });
            const text = this.serialize(o);
            try { await this.store.write(path, text, { create: true }); }
            catch (e) { if (e.exists) continue; throw e; }
            this.lastWritten[path] = text; this.base[path] = clone(o); this._set(path, o);
            this.lastSync = Date.now(); this.cacheSnapshot(); this.emit('local', path); this.emit('synced');
            resolve(id); return;
          }
          throw new Error('Could not find a free id in ' + slot);
        }).then(() => resolve(null));
      });
    },
    saveLedger() { return this.save('ledger.json', this.state.ledger); },
    remove(path) {
      this.apply(path, null); delete this.known[path]; delete this.lastWritten[path];
      this.emit('local', path);
      return this.queue(async () => { await this.store.remove(path); this.cacheSnapshot(); });
    },
    putBlob(path, blob) { return this.queue(() => this.store.write(path, blob)); },
    url(path) { return this.store ? this.store.url(path) : Promise.resolve(''); },
    list(dir) { return this.store ? this.store.list(dir) : Promise.resolve([]); },
    nextNum(slot, prefix, who) {
      const re = new RegExp('^' + prefix + '-' + who + '-(\\d+)$');
      let max = 0; for (const k of Object.keys(this.state[slot])) { const m = re.exec(k); if (m) max = Math.max(max, +m[1]); }
      return max + 1;
    },
    async copyAllTo(target) {
      const src = this.store;
      const man = await src.manifest();
      for (const p of Object.keys(man)) { const t = await src.read(p); if (t != null) await target.write(p, t); }
      for (const e of await src.list('sources')) if (e.kind === 'file') { const b = await src.readBlob('sources/' + e.name); if (b) await target.write('sources/' + e.name, b); }
    },
    /** Everything except sector.json (every teammate loads the pack themselves). */
    async exportBundle() {
      const out = { app: APP, schema: SCHEMA, exportedAt: nowIso(), from: me(), sector: this.state.sector ? this.state.sector.id : '', files: {} };
      const man = await this.store.manifest();
      for (const p of Object.keys(man)) if (p !== 'sector.json') out.files[p] = JSON.parse(await this.store.read(p));
      return out;
    }
  };

  // ---------- merging a teammate's work ----------
  // Two laptops share no history, so: for an item, the newer edit wins, but sources are unioned and a check
  // by anyone is kept. For ledger.json: keep ours, fill our gaps from theirs, union the members and votes.
  const srcKey = (s) => (String(s.url || '').trim().toLowerCase() || String(s.label || '').trim().toLowerCase());
  function mergeItem(mine, theirs) {
    if (!mine) return theirs;
    if (same(mine, theirs)) return mine;
    const newer = String(theirs.updatedAt || '') > String(mine.updatedAt || '');
    const older = newer ? mine : theirs, out = Object.assign({}, older, newer ? theirs : mine);
    // A field the newer copy left empty but the older one filled in was most likely never seen, not deleted: keep it.
    const blank = (v) => v == null || v === '' || (Array.isArray(v) && !v.length);
    for (const [k, v] of Object.entries(older)) if (blank(out[k]) && !blank(v)) out[k] = v;
    const byKey = new Map();
    for (const s of [...(mine.sources || []), ...(theirs.sources || [])]) {
      if (!s) continue;
      const k = srcKey(s), cur = byKey.get(k);
      if (!cur) byKey.set(k, Object.assign({}, s));
      else if (s.verified && !cur.verified) Object.assign(cur, { verified: true, verifiedBy: s.verifiedBy, verifiedAt: s.verifiedAt });
    }
    if (mine.sources || theirs.sources) out.sources = [...byKey.values()];
    return out;
  }
  function fillGaps(mine, theirs) {
    for (const [k, v] of Object.entries(theirs || {})) {
      const m = mine[k];
      if (m === undefined || m === null || m === '' || (Array.isArray(m) && !m.length && Array.isArray(v))) mine[k] = clone(v);
      else if (isObj(m) && isObj(v)) fillGaps(m, v);
    }
    return mine;
  }
  function mergeLedger(mine, theirs) {
    const out = fillGaps(normalizeLedger(clone(mine)), theirs);
    const names = new Set(out.team.members.map(m => m.name));
    for (const m of (theirs.team && theirs.team.members) || []) { const n = typeof m === 'string' ? m : m && m.name; if (n && !names.has(n)) { out.team.members.push({ name: n }); names.add(n); } }
    out.selection.votes = Object.assign({}, (theirs.selection || {}).votes || {}, out.selection.votes || {});
    return out;
  }

  // ---------- skills as zip files (built in the browser, store-only, no compression) ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (u8) => { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
  /** files: { 'skill-name/SKILL.md': 'text', … } → Blob (application/zip) */
  function makeZip(files) {
    const enc = new TextEncoder(), parts = [], dir = [];
    let off = 0;
    for (const [name, text] of Object.entries(files)) {
      const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
      parts.push(lh.buffer, nb, data); dir.push(ch.buffer, nb);
      off += 30 + nb.length + data.length;
    }
    const size = dir.reduce((n, x) => n + x.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, Object.keys(files).length, true); end.setUint16(10, Object.keys(files).length, true);
    end.setUint32(12, size, true); end.setUint32(16, off, true);
    return new Blob([...parts, ...dir, end.buffer], { type: 'application/zip' });
  }

  const isImage = (p) => /\.(jpe?g|png|webp|gif|heic|avif)$/i.test(p);

  // ---------- boot + storage bar ----------
  const fsSupported = () => 'showDirectoryPicker' in window;

  async function pickFolder() {
    if (!fsSupported()) {
      await modal({ title: 'This browser can’t open folders', body: h('div', null,
        h('p', null, 'Saving to a folder works in Chrome or Edge on a laptop.'),
        h('p', null, 'Here, your work is saved in this browser. Use ', h('b', null, 'Share my work'), ' to back it up and to send it to your team.')),
        actions: [{ label: 'OK', value: 1, cls: 'primary' }] });
      return null;
    }
    let handle;
    try { handle = await window.showDirectoryPicker({ id: APP, mode: 'readwrite' }); } catch { return null; }
    const store = new FsStore(handle);
    if (!(await store.permission(true))) { toast('Permission denied for that folder'); return null; }
    const man = await store.manifest();
    const cur = Ledger.store;
    if (!Object.keys(man).length && cur && cur.kind === 'browser' && cur.hasData()) {
      const v = await modal({ title: 'Move your work into this folder?', body: 'You have work saved in this browser. Copy it into “' + handle.name + '”?',
        actions: [{ label: 'Start empty', value: 'empty' }, { label: 'Copy it in', value: 'copy', cls: 'primary' }] });
      if (v === 'copy') { toast('Copying…'); await Ledger.copyAllTo(store); }
    }
    await idbPut('kv', 'handle', handle).catch(() => {});
    return store;
  }

  async function boot(ui) {
    if (fsSupported()) {
      const handle = await idbGet('kv', 'handle');
      if (handle) {
        const store = new FsStore(handle);
        let ok = false; try { ok = await store.permission(false); } catch {}
        if (ok) { try { await Ledger.open(store); return; } catch (e) { console.warn(e); } }
        const cache = Ledger.loadCache();
        ui.needReconnect(handle.name, async () => {
          if (await store.permission(true)) { await Ledger.open(store); return true; }
          return false;
        }, cache);
        return;
      }
    }
    await Ledger.open(new LocalStore());
  }

  function storageBar(container) {
    const pill = h('button', { class: 'pill', title: 'Where your work is saved' });
    const render = () => {
      const s = Ledger.store; pill.innerHTML = '';
      if (!s) { pill.append(h('span', { class: 'dot warn' }), 'Not connected'); return; }
      pill.append(h('span', { class: 'dot ' + (s.kind === 'browser' ? 'warn' : 'ok') }), s.kind === 'folder' ? 'Folder: ' + s.label : 'This browser only',
        s.kind === 'folder' && Ledger.lastSync ? h('span', { class: 'muted' }, ' · ' + ago(Ledger.lastSync)) : '');
    };
    pill.addEventListener('click', () => storageInfo());
    Ledger.on((t) => { if (t === 'load' || t === 'synced' || t === 'local') render(); });
    setInterval(render, 5000);
    render(); container.append(pill);
    return pill;

  const BUNDLE_PATH = /^(ledger\.json|sector\.json|(findings|opportunities|hypotheses|decisions|sessions)\/[A-Za-z0-9_-]+\.json)$/;
  /** Merges a shared board (or an agent's ledger-import.json) into this one. Returns counts. */
  async function importBundle(b) {
    const files = b && b.files ? b.files : b;
    if (!files || typeof files !== 'object') throw new Error('Not a ledger bundle');
    const r = { added: 0, updated: 0, same: 0 };
    for (const [path, obj] of Object.entries(files)) {
      if (!BUNDLE_PATH.test(path)) continue;
      const o = typeof obj === 'string' ? JSON.parse(obj) : obj;
      const [slot, key] = Ledger.pathToSlot(path);
      if (slot === 'ledger') {
        const cur = Ledger.state.ledger, merged = mergeLedger(cur, o);
        if (same(merged, cur)) { r.same++; continue; }
        await Ledger.save(path, merged); r.updated++;
      } else if (slot === 'sector') {
        if (Ledger.state.sector) { r.same++; continue; }
        await Ledger.save(path, o); r.added++;
      } else {
        const cur = Ledger.state[slot][key];
        const plain = cur ? JSON.parse(Ledger.serialize(cur)) : null;
        const merged = mergeItem(plain, o);
        if (plain && same(merged, plain)) { r.same++; continue; }
        const keepTime = merged.updatedAt;
        await Ledger.save(path, merged);
        if (keepTime) { Ledger.state[slot][key].updatedAt = keepTime; }
        cur ? r.updated++ : r.added++;
      }
    }
    return r;
  }

  const SKILL_FILES = {"opportunity-matrix/references/SCHEMA.md":"# Innovation Sprint Ledger: folder format (schema `innovation-sprint-ledger/1`)\r\n\r\nOne team = one folder of plain JSON files. `sprint.html` (one self-contained page, no server) reads and writes it, and so can you. The page checks the folder every few seconds, so whatever you change shows up on the student's screen on its own.\r\n\r\n## Getting started (agents: read this first)\r\n\r\nWhen a student opens this folder and says something like \"get me started\":\r\n\r\n1. Read `ledger.json` (team, members, assignments, agenda) and `sector.json` (their Sector Exploration Pack). Ask their name if you don't know it. It goes in `author` and in the ids you create.\r\n2. Use the skills in `.claude/skills/` or `.agents/skills/` if your app hasn't loaded them already: `sprint-ledger` (\"where are we?\"), `sector-research` (Sprints 1 and 2), `opportunity-matrix` (opportunities → hypotheses → matrix → decision), `workshop-handoff` (closing the session, Workshop 2 brief).\r\n3. Say in one line where the team is (the first Workshop 1 step that isn't done, see the table below) and offer the next step. Keep it short: they're in a timed workshop.\r\n4. They see your changes on their board (`sprint.html`, opened in Chrome or Edge and connected to this folder) within a few seconds.\r\n\r\nThis is the team's working record for the **Innovation Sprint Challenge** (Spain-US Chamber of Commerce, Miami International Week). Workshop 1, *AI Opportunity Discovery Sprint*, takes the team from a sector to one chosen business hypothesis:\r\n\r\n| Step | Program | Files |\r\n|---|---|---|\r\n| Kick-off | Team Leader, how we'll work, who takes which dimension | `ledger.json → team, assignments` |\r\n| Sprint 1 · PESTEL | Each person takes one dimension. The team stars the key external factors | `findings/` with `\"sprint\": \"pestel\"`, `\"key\": true` |\r\n| Sprint 2 · How the sector works | Each person takes one dimension. The team lists possible opportunities | `findings/` with `\"sprint\": \"sector\"`, `opportunities/` |\r\n| Three hypotheses + weighted matrix | Compare, decide by consensus or a vote on the matrix criteria | `hypotheses/`, `ledger.json → matrix, selection`, `decisions/` |\r\n| Close | Decisions on record, handoff to Workshop 2 (Go to Market and Brand) | `decisions/`, `sessions/` |\r\n\r\n```\r\n<team folder>/\r\n  ledger.json                team, agenda + shared timer, assignments, matrix criteria, selection\r\n  sector.json                the team's Sector Exploration Pack, parsed (read-only for students)\r\n  findings/F-ana-01.json     one research finding per file (Sprint 1 and Sprint 2)\r\n  opportunities/O-ben-01.json  one possible opportunity per file\r\n  hypotheses/H-carla-01.json   one business hypothesis per file, with its matrix scores\r\n  decisions/D-carla-01.json    one team decision per file\r\n  sessions/2026-10-20.json   one end-of-session handoff per date\r\n  sources/                   original files (the pack .docx, screenshots)\r\n  AGENTS.md                  this file   ·   CLAUDE.md → points here\r\n  .claude/skills/, .agents/skills/   the five skills (the board writes them: ✦ Set up your AI)\r\n```\r\n\r\nStudents may each keep their own copy of the team's work and merge them (the board's **⇄ Share**), or connect the same OneDrive/Google Drive/Dropbox folder. Either way, ids carry the author's name, so work from different people never collides.\r\n\r\n## Rules for editing\r\n\r\n1. **Valid JSON only.** Two-space indent, UTF-8, a trailing newline. If a file won't parse, the board shows a warning and skips it.\r\n2. **The file name is the id, and ids carry their author.** `findings/F-ana-03.json` must contain `\"id\": \"F-ana-03\"`. The pattern is `<letter>-<author>-<nn>`: `F` findings, `O` opportunities, `H` hypotheses, `D` decisions. `<author>` is the person's first name in lowercase ASCII (`José` → `jose`), or `team` if nobody is named. `<nn>` is two digits and goes up by one **per author**: take the highest existing `F-ana-…` and add one. Sessions use the date `YYYY-MM-DD`. Never rename an existing id, because other files point to it.\r\n3. **Edit, don't rewrite.** Change only the fields you mean to change. Keep unknown fields. Set `updatedAt` to the current ISO time: when teammates merge their work, the newer edit of an item wins.\r\n4. **The team decides; AI proposes.** Don't star key factors, shortlist opportunities, score the matrix, choose a hypothesis or log a decision unless the team told you what they decided. You can *suggest*, in chat.\r\n5. **Never invent evidence.** Every source must be real and checkable: publisher, title, year, URL. If you're not sure a source exists or says this, write the claim without a source and say \"source to find\". Never invent numbers.\r\n6. **`verified` means a person opened the source.** Only set `\"verified\": true` (with `verifiedBy` and `verifiedAt`) when a named team member tells you they opened it and it says what the finding claims. You checking it yourself doesn't count. Anything you add starts with `\"verified\": false` and `\"origin\": \"ai\"`.\r\n7. **Lists are arrays of short strings,** one idea per item, with no bullets or numbering inside the strings.\r\n8. **Don't delete what the team rejected.** An opportunity they dropped stays, with `\"shortlisted\": false`. A hypothesis they dropped stays in the matrix. A rejected hypothesis can be hidden with `\"archived\": true`.\r\n\r\n## ledger.json\r\n\r\n(The `//` comments below explain the fields. Real files can't contain comments.)\r\n\r\n```json\r\n{\r\n  \"schema\": \"innovation-sprint-ledger/1\",\r\n  \"team\": {\r\n    \"name\": \"Team 3\",\r\n    \"number\": \"3\",\r\n    \"members\": [{ \"name\": \"Ana\" }, { \"name\": \"Ben\" }],   // 5 or 6 people\r\n    \"leader\": \"Ana\",                                      // the Team Leader: talks to facilitators, keeps time. Not the boss.\r\n    \"agreements\": [\"We decide by consensus; if we can't in 3 minutes, we vote with the matrix criteria.\"]\r\n  },\r\n  \"workshop\": {\r\n    \"current\": 1,\r\n    \"agenda\": [ { \"id\": \"pestel\", \"label\": \"Sprint 1 · PESTEL research\", \"minutes\": 15, \"tab\": \"pestel\" } ],   // 120 minutes in total\r\n    \"timer\": { \"blockId\": \"pestel\", \"startedAt\": \"2026-10-20T14:10:00Z\" }   // shared countdown; blockId \"\" = not started\r\n  },\r\n  \"assignments\": {\r\n    \"pestel\": { \"political\": \"Ana\", \"economic\": \"Ben\", \"social\": \"\", \"technological\": \"\", \"environmental\": \"\", \"legal\": \"\" },\r\n    \"sector\": { \"ecosystem\": \"\", \"valuechain\": \"\", \"frictions\": \"\", \"competition\": \"\", \"segments\": \"\", \"models\": \"\" }\r\n  },\r\n  \"matrix\": {\r\n    \"scale\": 5,                                  // scores are 1 (weak) to 5 (strong); 0 or missing = not scored\r\n    \"criteria\": [ { \"id\": \"evidence\", \"label\": \"Evidence the problem is real\", \"weight\": 25, \"hint\": \"…\" } ]   // weights add up to 100\r\n  },\r\n  \"selection\": {\r\n    \"hypothesisId\": \"H-carla-01\",                        // the chosen hypothesis, \"\" until the team decides\r\n    \"method\": \"consensus\",                       // consensus | vote\r\n    \"votes\": { \"Ana\": \"H-carla-01\", \"Ben\": \"H-ana-01\" },       // only if they voted\r\n    \"rationale\": \"Strongest evidence and a customer we can reach in Miami.\",\r\n    \"decidedAt\": \"2026-10-20T15:45:00Z\"\r\n  },\r\n  \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\nDefault matrix criteria (the team can rename, reweight, add or remove them): evidence the problem is real 25 · clear, reachable customer 15 · size of the opportunity 15 · why now 10 · someone will pay 20 · feasible to launch 15. Matrix score = Σ(weight × score) / (Σweight × scale) × 100.\r\n\r\n## sector.json (the Sector Exploration Pack)\r\n\r\nMade by the board (Brief tab → Load a pack .docx), by `bun kit.ts sector pack.docx`, or by the `pack-to-sector` skill. Students read it, they don't edit it. Fields: `schema: \"sector-pack/1\"`, `id`, `name`, `referenceMarket`, `intro`, `definition`, `inside[]`, `outside[]`, `players[{type, howMoney, examples}]`, `revenueModels[]`, `valueChain{note, steps[{name, actors}], enablingLabel, enabling[]}`, `keyFigures[{level, figure, source}]`, `figuresNote`, `challenge`, `pestelNote`, `sprint2Questions[{dimension, question}]`, `glossary[{term, def}]`, `sources[{group, items[]}]`, `extra[{title, blocks}]` (sections it couldn't map).\r\n\r\nThe pack gives a common starting point. **It doesn't choose the problem, customer, solution, technology or business model.** The team does.\r\n\r\n## findings/F-ben-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"F-ben-01\",\r\n  \"sprint\": \"pestel\",            // pestel | sector\r\n  \"dimension\": \"economic\",       // pestel: political | economic | social | technological | environmental | legal\r\n                                 // sector: ecosystem | valuechain | frictions | competition | segments | models\r\n  \"author\": \"Ben\",               // the team member who owns it (who researched it, or who asked the AI)\r\n  \"title\": \"International arrivals fell in 2025 while domestic travel held\",   // one-line headline\r\n  \"detail\": \"68.3M international arrivals in 2025 vs 72.4M in 2024; NTTO projects ~70.5M in 2026.\",\r\n  \"whoAffected\": \"Operators that depend on overseas visitors\",\r\n  \"implication\": \"Revenue mix is shifting; operators look for ways to win domestic or Latin American demand.\",\r\n  \"sources\": [\r\n    { \"label\": \"NTTO, International Visitor Arrivals\", \"url\": \"https://…\", \"year\": \"2026\",\r\n      \"verified\": false, \"verifiedBy\": \"\", \"verifiedAt\": null,\r\n      \"pack\": false }            // true = cited from the Sector Exploration Pack's key figures (already checked by the organizers)\r\n  ],\r\n  \"origin\": \"team\",              // team | ai\r\n  \"key\": false,                  // Sprint 1 only: the team starred it as a key external factor\r\n  \"notes\": \"\",\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## opportunities/O-ana-01.json\r\n\r\nA specific friction for a clearly defined customer. Not a trend, and not yet a solution.\r\n\r\n```json\r\n{\r\n  \"id\": \"O-ana-01\",\r\n  \"title\": \"Cruise passengers' dead time on embarkation day\",\r\n  \"friction\": \"What goes wrong, or costs time, money or trust\",\r\n  \"who\": \"Who experiences it, as specifically as possible, and how many\",\r\n  \"howSolvedToday\": \"Workarounds and competitors, and what they fail to do\",\r\n  \"whyNow\": \"The external factor (Sprint 1) that makes it urgent\",\r\n  \"evidence\": \"Data, reviews, reports, in words\",\r\n  \"findingIds\": [\"F-ben-03\", \"F-carla-01\"],\r\n  \"sources\": [],\r\n  \"author\": \"Ana\", \"origin\": \"team\",\r\n  \"shortlisted\": false,          // the team shortlisted it for the hypotheses\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## hypotheses/H-ana-01.json\r\n\r\n```json\r\n{\r\n  \"id\": \"H-ana-01\", \"order\": 1,\r\n  \"title\": \"Working name\",\r\n  \"customer\": \"\", \"problem\": \"\", \"solution\": \"\", \"valueProp\": \"\", \"revenueModel\": \"\",\r\n  \"businessModel\": \"B2B\",        // B2C | B2B | B2B2C | Platform | Institutional | \"\"\r\n  \"whyNow\": \"\",\r\n  \"launchMarket\": \"Miami-Dade\",  // the Exploration Challenge asks for an initial launch market…\r\n  \"launchMarketWhy\": \"\",         // …justified with data: a figure and its source\r\n  \"openQuestions\": [\"assumptions that must be true and aren't proven yet\"],\r\n  \"opportunityIds\": [\"O-ana-01\"],\r\n  \"sources\": [],\r\n  \"scores\": { \"evidence\": 4, \"customer\": 3 },   // matrix scores by criterion id, set by the TEAM\r\n  \"author\": \"\", \"origin\": \"team\", \"archived\": false,\r\n  \"createdAt\": \"…\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## decisions/D-carla-01.json\r\n\r\nEvery sprint closes with a concrete decision.\r\n\r\n```json\r\n{ \"id\": \"D-carla-01\", \"workshop\": 1, \"step\": \"pestel\",   // pestel | sector | opportunities | hypothesis | team | other\r\n  \"decision\": \"Key external factors: …\", \"how\": \"consensus\", \"rationale\": \"\", \"votes\": { \"Ana\": \"H-carla-01\" },\r\n  \"date\": \"2026-10-20\", \"by\": \"Ana\", \"createdAt\": \"…\", \"updatedAt\": \"…\" }\r\n```\r\n\r\n## sessions/2026-10-20.json (end-of-session handoff)\r\n\r\n```json\r\n{\r\n  \"id\": \"2026-10-20\", \"date\": \"2026-10-20\", \"workshop\": 1, \"title\": \"Workshop 1 · Opportunity Discovery\",\r\n  \"decided\": \"What the team decided: the idea, the customer, the launch market\",\r\n  \"evidenceGaps\": \"One per line: what we assumed but haven't proven\",\r\n  \"questionsForNext\": \"One per line: what to ask in Workshop 2\",\r\n  \"nextTask\": \"Before the next workshop, who does what\",\r\n  \"notes\": \"\", \"updatedAt\": \"…\"\r\n}\r\n```\r\n\r\n## No file access? Hand back JSON\r\n\r\nIn a chat app you can't write files. Instead, finish your answer with one JSON block that the board's **Paste AI answer** buttons read: `{\"findings\":[…]}` on a research card, `{\"opportunities\":[…]}` or `{\"hypotheses\":[…]}` on those tabs (the skills show the exact shapes). The board assigns the ids.\r\n\r\nFor anything else (several kinds of files at once), give one block in the board's sharing format. The student pastes it into **⇄ Share → Add a teammate's work**:\r\n\r\n```json\r\n{ \"schema\": \"innovation-sprint-ledger/1\", \"from\": \"Claude\", \"files\": { \"findings/F-ana-07.json\": { … }, \"decisions/D-ana-02.json\": { … } } }\r\n```\r\n","opportunity-matrix/SKILL.md":"---\r\nname: opportunity-matrix\r\ndescription: Take an Innovation Sprint team from research findings to one chosen business hypothesis in Workshop 1. That means listing possible opportunities (a specific friction, who has it, how it's solved today, the evidence), drafting three distinct hypotheses (customer, problem, solution, value proposition, revenue model, launch market), running the weighted decision matrix, stress-testing the hypotheses like a skeptical seed investor, recording the team's decision, and justifying the launch market with data. Use when a team says \"turn our findings into opportunities\", \"help us write three hypotheses\", \"score the matrix\", \"challenge our ideas\", \"which one should we pick\", \"justify Miami as launch market\", or \"log our decision\".\r\n---\r\n\r\n# Findings → opportunities → three hypotheses → one decision\r\n\r\nThis is the second half of Workshop 1. **The team decides; you propose and challenge.** Never shortlist, score, choose or log a decision on your own. Write those only after the team tells you what they decided.\r\n\r\nRead `references/SCHEMA.md` (file formats), `sector.json` (the Exploration Challenge, the sector's limits, the key figures) and the team's `findings/`.\r\n\r\n## 1 · Possible opportunities (after Sprint 2)\r\n\r\nThe Exploration Challenge asks for **one specific, evidence-backed friction experienced by a clearly defined customer**, and why it's worth solving now.\r\n\r\n1. Start from the starred Sprint 1 factors (`\"key\": true`) and all Sprint 2 findings.\r\n2. Propose 6–8 candidates. Write each to `opportunities/O-<author>-<nn>.json` (the author's next free number, see SCHEMA.md) with `title`, `friction`, `who` (specific, and how many if known), `howSolvedToday` (and what that fails to do), `whyNow` (the external factor), `evidence`, `findingIds` (only ids that exist), `origin: \"ai\"`, `shortlisted: false`.\r\n3. Tests for each candidate. Say which ones fail:\r\n   - Is it a **problem**, or just a **trend**? (\"AI is growing\" is a trend. \"Small tour operators re-type every OTA booking into their own calendar\" is a problem.)\r\n   - Is the customer **identifiable**? Could the team find 10 of them next week?\r\n   - Does the e
